name: GOLD V2 M5 Range ATR Shadow Diagnosis (Research Only)

on:
  push:
    branches:
      - research/m5-range-atr-shadow-20261113
    paths:
      - 'src/gold_strategy_v2.js'
      - 'scripts/backtest-gold-v2.mjs'
      - 'scripts/run-gold-m5-range-shadow.mjs'
      - 'tests/gold_strategy_v2.test.js'
      - 'docs/GOLD_M5_RANGE_ATR_SHADOW_RUNBOOK.md'
      - '.github/workflows/gold-v2-m5-range-shadow.yml'

permissions:
  actions: read
  contents: read

jobs:
  range-shadow:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout research branch
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Test strategy and diagnostic-only bypass
        run: node --test tests/gold_strategy_v2.test.js

      - name: Download fixed Walk-Forward split datasets
        uses: actions/download-artifact@v4
        with:
          name: gold-v2-walkforward
          path: gold-v2-walkforward
          repository: ${{ github.repository }}
          run-id: 43349812731
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Validate source datasets
        run: |
          test -s gold-v2-walkforward/is_data.json.gz
          test -s gold-v2-walkforward/oos_data.json.gz
          ls -lh gold-v2-walkforward/is_data.json.gz gold-v2-walkforward/oos_data.json.gz

      - name: Run isolated Range ATR shadow diagnosis
        env:
          GOLD_RANGE_SHADOW_SOURCE_DIR: gold-v2-walkforward
          GOLD_RANGE_SHADOW_OUTPUT_DIR: gold-m5-range-shadow-output
          GOLD_RANGE_SHADOW_SOURCE_RUN_ID: '43349812731'
        run: node scripts/run-gold-m5-range-shadow.mjs

      - name: Upload research-only diagnostic reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gold-v2-m5-range-shadow
          path: gold-m5-range-shadow-output/
          retention-days: 30
          if-no-files-found: warn
