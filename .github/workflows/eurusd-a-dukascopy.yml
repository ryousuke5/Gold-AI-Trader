name: EURUSD Strategy A Dukascopy Research
on:
  push:
    branches: [main]
    paths:
      - 'scripts/backtest-eurusd.mjs'
      - 'src/eurusd_features.js'
      - '.github/workflows/eurusd-a-dukascopy.yml'
  workflow_dispatch:
concurrency:
  group: eurusd-a-dukascopy
  cancel-in-progress: true
jobs:
  research:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: current
            range_lookback: "6"
            min_range_atr: "0.75"
            max_range_atr: "2.00"
            breakout_min_atr: "0.10"
            body_atr: "0.35"
            close_location: "0.70"
            buy_min: "50"
            buy_max: "68"
            sell_min: "32"
            sell_max: "50"
          - name: balanced
            range_lookback: "5"
            min_range_atr: "0.50"
            max_range_atr: "2.50"
            breakout_min_atr: "0.05"
            body_atr: "0.25"
            close_location: "0.60"
            buy_min: "48"
            buy_max: "70"
            sell_min: "30"
            sell_max: "52"
          - name: frequent
            range_lookback: "4"
            min_range_atr: "0.50"
            max_range_atr: "2.50"
            breakout_min_atr: "0.05"
            body_atr: "0.20"
            close_location: "0.58"
            buy_min: "47"
            buy_max: "72"
            sell_min: "28"
            sell_max: "53"
          - name: compromise
            range_lookback: "4"
            min_range_atr: "0.50"
            max_range_atr: "2.50"
            breakout_min_atr: "0.05"
            body_atr: "0.25"
            close_location: "0.60"
            buy_min: "48"
            buy_max: "70"
            sell_min: "30"
            sell_max: "52"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npm test
      - name: Static validate EURUSD MT4 monitor
        run: npm run test:mt4
      - name: Run five-year Strategy A backtest on Dukascopy
        env:
          BACKTEST_M15_SOURCE: DUKASCOPY
          BACKTEST_H1_SOURCE: FROM_M15
          BACKTEST_LOOKBACK_DAYS: "1825"
          BACKTEST_SERVER_TIMEZONE: Europe/Nicosia
          BACKTEST_INITIAL_EQUITY: "100000"
          BACKTEST_RISK_PCT: "0.25"
          BACKTEST_SPREAD_PIPS: "0.8"
          BACKTEST_SLIPPAGE_PIPS: "0.1"
          BACKTEST_MIN_STOP_ATR: "0.50"
          BACKTEST_MAX_STOP_ATR: "1.50"
          BACKTEST_MAX_SPREAD_PIPS: "1.20"
          BACKTEST_MAX_SPREAD_TO_TP_PCT: "12"
          BACKTEST_MAX_DAILY_LOSS_PCT: "2"
          BACKTEST_MAX_DRAWDOWN_PCT: "5"
          BACKTEST_RANGE_LOOKBACK: ${{ matrix.range_lookback }}
          BACKTEST_MIN_RANGE_ATR: ${{ matrix.min_range_atr }}
          BACKTEST_MAX_RANGE_ATR: ${{ matrix.max_range_atr }}
          BACKTEST_BREAKOUT_MIN_ATR: ${{ matrix.breakout_min_atr }}
          BACKTEST_BREAKOUT_MIN_BODY_ATR: ${{ matrix.body_atr }}
          BACKTEST_BREAKOUT_MIN_CLOSE_LOCATION: ${{ matrix.close_location }}
          BACKTEST_BREAKOUT_BUY_RSI_MIN: ${{ matrix.buy_min }}
          BACKTEST_BREAKOUT_BUY_RSI_MAX: ${{ matrix.buy_max }}
          BACKTEST_BREAKOUT_SELL_RSI_MIN: ${{ matrix.sell_min }}
          BACKTEST_BREAKOUT_SELL_RSI_MAX: ${{ matrix.sell_max }}
          BACKTEST_OUTPUT_DIR: backtest-a-dukascopy-output
        run: node scripts/backtest-eurusd.mjs
      - name: Upload Strategy A results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eurusd-a-dukascopy-${{ matrix.name }}
          path: backtest-a-dukascopy-output/
          retention-days: 30
