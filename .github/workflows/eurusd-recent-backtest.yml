name: EURUSD Recent Backtest

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  spread_sensitivity:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        spread: ["0.5", "0.8", "1.2"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - name: Run 180-day technical backtest
        env:
          BACKTEST_LOOKBACK_DAYS: "180"
          BACKTEST_INITIAL_EQUITY: "100000"
          BACKTEST_RISK_PCT: "0.25"
          BACKTEST_SPREAD_PIPS: ${{ matrix.spread }}
          BACKTEST_SLIPPAGE_PIPS: "0.1"
          BACKTEST_MIN_STOP_ATR: "0.50"
          BACKTEST_MAX_STOP_ATR: "1.50"
          BACKTEST_MIN_RR: "1.80"
          BACKTEST_MAX_SPREAD_PIPS: "1.20"
          BACKTEST_MAX_SPREAD_TO_TP_PCT: "12"
          BACKTEST_OUTPUT_DIR: backtest-output
          BACKTEST_M15_SOURCE: "https://raw.githubusercontent.com/getdata-finance/eurusd-15m-ohlcv-forex-historical-data/main/EURUSD_15m.csv"
          BACKTEST_H1_SOURCE: "FROM_M15"
        run: node scripts/backtest-eurusd.mjs
      - name: Upload backtest artifact
        uses: actions/upload-artifact@v4
        with:
          name: eurusd-recent-backtest-${{ matrix.spread }}pip
          path: backtest-output/
          retention-days: 30
