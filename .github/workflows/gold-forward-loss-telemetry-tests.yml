name: GOLD Forward Loss Telemetry Research Tests

on:
  push:
    branches:
      - research/gold-forward-loss-telemetry-20261114
  workflow_dispatch:

permissions:
  contents: read

jobs:
  telemetry-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: node --check server.js
      - run: node --check src/gold_forward_research_telemetry.js
      - run: node --test tests/gold_forward_research_telemetry.test.js tests/gold_forward_research_integration.test.js
