name: GOLD H4H1 Demo Cost Logger Tests

on:
  pull_request:
    paths:
      - "research/gold_h4_h1_cost_validation/**"
      - ".github/workflows/gold-h4-h1-demo-cost-tests.yml"
  workflow_dispatch:

jobs:
  python-validation:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install audit dependency
        run: python -m pip install --upgrade numpy
      - name: Compile Python validation scripts
        run: |
          python -m py_compile research/gold_h4_h1_cost_validation/audit_frozen_h4h1_costs.py
          python -m py_compile research/gold_h4_h1_cost_validation/audit_spread_log_integrity.py
          python -m py_compile research/gold_h4_h1_cost_validation/reconciliation/audit_available_spread_log.py
          python -m py_compile research/gold_h4_h1_cost_validation/demo/summarize_demo_execution_costs.py
          python -m py_compile research/gold_h4_h1_cost_validation/demo/test_demo_cost_summarizer.py
          python -m py_compile research/gold_h4_h1_cost_validation/demo/test_logger_safety.py
      - name: Test demo cost aggregation with synthetic records
        run: python research/gold_h4_h1_cost_validation/demo/test_demo_cost_summarizer.py
      - name: Check demo logger safety guards
        run: python research/gold_h4_h1_cost_validation/demo/test_logger_safety.py
