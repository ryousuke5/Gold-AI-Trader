name: GOLD M1 Scalp Research

concurrency:
  group: gold-m1-scalp-research-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

on:
  pull_request:
    branches: [main]
    paths:
      - 'scripts/fetch-xauusd-m1-chunk.py'
      - 'scripts/backtest-gold-m1-scalp.mjs'
      - 'scripts/backtest-gold-m15-trend-pullback.mjs'
      - '.github/workflows/gold-m1-scalp-research.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      chunks: ${{ steps.plan.outputs.chunks }}
      start_date: ${{ steps.plan.outputs.start_date }}
      end_date: ${{ steps.plan.outputs.end_date }}
    steps:
      - uses: actions/checkout@v4
      - name: Build cache-aligned five-year M1 chunk plan
        id: plan
        run: |
          python3 <<'PY'
          import json, os
          from datetime import date, timedelta
          cfg=json.load(open("config/gold-v2-data-window.json",encoding="utf-8"))
          end=date.fromisoformat(cfg["end_date_utc"])
          days=int(cfg["lookback_days"])
          chunk_days=int(cfg["chunk_days"])
          start=end-timedelta(days=days)
          chunks=[]
          cursor=start
          while cursor<end:
            nxt=min(cursor+timedelta(days=chunk_days),end)
            chunks.append({"id":f"{cursor:%Y%m%d}_{nxt:%Y%m%d}","start":cursor.isoformat(),"end":nxt.isoformat()})
            cursor=nxt
          with open(os.environ["GITHUB_OUTPUT"],"a",encoding="utf-8") as f:
            f.write("chunks="+json.dumps(chunks,separators=(",",":"))+"\n")
            f.write(f"start_date={start.isoformat()}\n")
            f.write(f"end_date={end.isoformat()}\n")
          print(json.dumps({"start":start.isoformat(),"end_exclusive":end.isoformat(),"chunk_count":len(chunks),"days":days},indent=2))
          PY

  prepare-chunks:
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        chunk: ${{ fromJSON(needs.plan.outputs.chunks) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Restore existing resumable M1 daily cache
        id: m1cache
        uses: actions/cache/restore@v4
        with:
          path: gold-xauusd-data/raw/${{ matrix.chunk.id }}
          key: xauusd-m1-v5-${{ runner.os }}-${{ matrix.chunk.id }}-${{ github.run_id }}
          restore-keys: |
            xauusd-v4-m1-v4-r1-${{ runner.os }}-${{ matrix.chunk.id }}-
            xauusd-v4-m1--${{ runner.os }}-${{ matrix.chunk.id }}-
            xauusd-m1-v5-${{ runner.os }}-${{ matrix.chunk.id }}-
      - name: Prepare output directories
        run: |
          mkdir -p "gold-xauusd-data/raw/${{ matrix.chunk.id }}" gold-xauusd-data/chunks
      - name: Validate M1 downloader
        run: python3 scripts/fetch-xauusd-m1-chunk.py --self-test
      - name: Build M1 bars from cached/downloaded daily records
        run: |
          python3 scripts/fetch-xauusd-m1-chunk.py \
            --start-date "${{ matrix.chunk.start }}" \
            --end-date "${{ matrix.chunk.end }}" \
            --cache-dir "gold-xauusd-data/raw/${{ matrix.chunk.id }}" \
            --output-file "gold-xauusd-data/chunks/xauusd-m5-${{ matrix.chunk.id }}.json.gz" \
            --m1-output-file "gold-xauusd-data/chunks/xauusd-m1-${{ matrix.chunk.id }}.json.gz" \
            --manifest-file "gold-xauusd-data/chunks/xauusd-m1-${{ matrix.chunk.id }}.manifest.json" \
            --request-delay 2.5 --timeout 30 --retries 8
          gzip -t "gold-xauusd-data/chunks/xauusd-m1-${{ matrix.chunk.id }}.json.gz"
      - name: Save newly downloaded M1 checkpoint
        if: always() && steps.m1cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: gold-xauusd-data/raw/${{ matrix.chunk.id }}
          key: xauusd-m1-v5-${{ runner.os }}-${{ matrix.chunk.id }}-${{ github.run_id }}
      - name: Upload M1 research chunk
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: gold-xauusd-m1-chunk-${{ matrix.chunk.id }}
          path: |
            gold-xauusd-data/chunks/xauusd-m1-${{ matrix.chunk.id }}.json.gz
            gold-xauusd-data/chunks/xauusd-m1-${{ matrix.chunk.id }}.manifest.json
          retention-days: 7
          if-no-files-found: error

  assemble:
    needs: [plan, prepare-chunks]
    outputs:
      end_date: ${{ needs.plan.outputs.end_date }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Download M1 chunks
        uses: actions/download-artifact@v4
        with:
          pattern: gold-xauusd-m1-chunk-*
          path: gold-xauusd-data/chunks
          merge-multiple: true
      - name: Assemble and validate fixed five-year M1 history
        env:
          START_DATE: ${{ needs.plan.outputs.start_date }}
          END_DATE: ${{ needs.plan.outputs.end_date }}
        run: |
          python3 <<'PY'
          import gzip,json,hashlib,os
          from pathlib import Path
          root=Path("gold-xauusd-data/chunks")
          files=sorted(root.glob("xauusd-m1-*.json.gz"))
          if len(files)<100: raise SystemExit(f"Expected >=100 M1 chunks, got {len(files)}")
          bars=[]; chunks=[]
          for file in files:
            rows=json.loads(gzip.decompress(file.read_bytes()).decode("utf-8"))
            if not isinstance(rows,list) or not rows: raise SystemExit(f"Empty or invalid M1 chunk: {file}")
            bars.extend(rows); chunks.append({"file":file.name,"bars":len(rows)})
          bars.sort(key=lambda x:int(x["time"]))
          dedup=[]; last=None
          for row in bars:
            ts=int(row["time"])
            if ts==last: continue
            if last is not None and ts<last: raise SystemExit("M1 timestamps not sorted")
            dedup.append(row); last=ts
          start_ts=int(__import__("datetime").datetime.fromisoformat(os.environ["START_DATE"]).replace(tzinfo=__import__("datetime").timezone.utc).timestamp())
          end_ts=int(__import__("datetime").datetime.fromisoformat(os.environ["END_DATE"]).replace(tzinfo=__import__("datetime").timezone.utc).timestamp())
          dedup=[b for b in dedup if start_ts<=int(b["time"])<end_ts]
          if len(dedup)<1000000: raise SystemExit(f"Too few M1 bars: {len(dedup)}")
          output=Path("gold-xauusd-data/xauusd-m1.json.gz")
          output.parent.mkdir(parents=True,exist_ok=True)
          payload=json.dumps(dedup,separators=(",",":")).encode("utf-8")
          with gzip.open(output,"wb",compresslevel=9) as f: f.write(payload)
          manifest={
            "instrument":"XAUUSD","provider":"Dukascopy Historical Data Feed","resolution":"M1 BID OHLC",
            "requested_start_date_utc":os.environ["START_DATE"],
            "requested_end_date_exclusive_utc":os.environ["END_DATE"],
            "first_bar_utc":__import__("datetime").datetime.fromtimestamp(int(dedup[0]["time"]),__import__("datetime").timezone.utc).isoformat(),
            "last_bar_utc":__import__("datetime").datetime.fromtimestamp(int(dedup[-1]["time"]),__import__("datetime").timezone.utc).isoformat(),
            "bars":len(dedup),"source_chunks":len(files),
            "output_sha256":hashlib.sha256(output.read_bytes()).hexdigest(),
            "source_note":"Bid OHLC; no historical XM Ask or spread fields."
          }
          Path("gold-xauusd-data/xauusd_m1_manifest.json").write_text(json.dumps(manifest,indent=2),encoding="utf-8")
          print(json.dumps(manifest,indent=2))
          PY
      - name: Upload fixed M1 dataset
        uses: actions/upload-artifact@v4
        with:
          name: gold-xauusd-m1-1825d
          path: |
            gold-xauusd-data/xauusd-m1.json.gz
            gold-xauusd-data/xauusd_m1_manifest.json
          retention-days: 30
          if-no-files-found: error

  backtest:
    needs: assemble
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Download fixed M1 dataset
        uses: actions/download-artifact@v4
        with:
          name: gold-xauusd-m1-1825d
          path: gold-xauusd-data
      - name: Validate M1 backtester
        run: node --check scripts/backtest-gold-m1-scalp.mjs
      - name: Run five-year and independent recent-730d M1 scalp tests
        env:
          GOLD_M1_SCALP_DATA_FILE: gold-xauusd-data/xauusd-m1.json.gz
          GOLD_M1_SCALP_OUTPUT_DIR: gold-m1-scalp-output
          GOLD_M1_SCALP_INITIAL_EQUITY: '100000'
          GOLD_M1_SCALP_RISK_PCT: '0.25'
          GOLD_RESEARCH_END_UTC: ${{ needs.assemble.outputs.end_date }}T00:00:00Z
        run: node scripts/backtest-gold-m1-scalp.mjs
      - name: Upload M1 scalp results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gold-m1-scalp-research
          path: gold-m1-scalp-output/
          retention-days: 30
          if-no-files-found: warn

      - name: Validate M15 trend pullback backtester
        run: node --check scripts/backtest-gold-m15-trend-pullback.mjs
      - name: Run M15 trend pullback unit checks
        run: node scripts/backtest-gold-m15-trend-pullback.mjs --self-test
      - name: Run five-year and independent recent-730d M15 pullback tests
        env:
          GOLD_M15_PULLBACK_DATA_FILE: gold-xauusd-data/xauusd-m1.json.gz
          GOLD_M15_PULLBACK_OUTPUT_DIR: gold-m15-trend-pullback-output
          GOLD_PULLBACK_INITIAL_EQUITY: '100000'
          GOLD_PULLBACK_RISK_PCT: '0.25'
          GOLD_RESEARCH_END_UTC: ${{ needs.assemble.outputs.end_date }}T00:00:00Z
        run: node scripts/backtest-gold-m15-trend-pullback.mjs
      - name: Upload M15 trend pullback results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gold-m15-trend-pullback-research
          path: gold-m15-trend-pullback-output/
          retention-days: 30
          if-no-files-found: warn
