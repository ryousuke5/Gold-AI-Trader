name: USDJPY Data Diagnostic

on:
  workflow_dispatch:
  pull_request:
    branches: [main]

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Inspect raw USDJPY CSV
        run: node scripts/inspect-usdjpy-data.mjs
