name: EURUSD Strategy C Research Backtest
on:
  push:
    branches: [main]
    paths:
      - 'src/eurusd_pullback_c.js'
      - 'scripts/backtest-eurusd-pullback-c.mjs'
      - 'tests/eurusd_pullback_c.test.js'
      - '.github/workflows/eurusd-pullback-c-backtest.yml'
  workflow_dispatch:
concurrency:
  group: eurusd-pullback-c-backtest
  cancel-in-progress: true
jobs:
  research:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: balanced
            min_retrace_ratio: "0.20"
            max_retrace_ratio: "0.90"
            min_impulse_atr: "0.40"
            min_pullback_atr: "0.08"
            min_h1_agreement: "0.60"
            break_buffer_atr: "0.03"
            tp_r: "1.50"
          - name: selective
            min_retrace_ratio: "0.25"
            max_retrace_ratio: "0.80"
            min_impulse_atr: "0.50"
            min_pullback_atr: "0.10"
            min_h1_agreement: "0.6666667"
            break_buffer_atr: "0.03"
            tp_r: "1.50"
          - name: lower-target
            min_retrace_ratio: "0.20"
            max_retrace_ratio: "0.90"
            min_impulse_atr: "0.40"
            min_pullback_atr: "0.08"
            min_h1_agreement: "0.60"
            break_buffer_atr: "0.03"
            tp_r: "1.30"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npm test
      - name: Run Strategy C research backtest
        env:
          PULLBACK_BACKTEST_SOURCE: dukascopy
          PULLBACK_BACKTEST_LOOKBACK_DAYS: "1825"
          PULLBACK_BACKTEST_SPREAD_PIPS: "0.8"
          PULLBACK_BACKTEST_SLIPPAGE_PIPS: "0.1"
          PULLBACK_BACKTEST_MAX_HOLD_BARS: "96"
          PULLBACK_BACKTEST_COOLDOWN_BARS: "2"
          PULLBACK_BACKTEST_C_MIN_RETRACE_RATIO: "${{ matrix.min_retrace_ratio }}"
          PULLBACK_BACKTEST_C_MAX_RETRACE_RATIO: "${{ matrix.max_retrace_ratio }}"
          PULLBACK_BACKTEST_C_MIN_IMPULSE_ATR: "${{ matrix.min_impulse_atr }}"
          PULLBACK_BACKTEST_C_MIN_PULLBACK_ATR: "${{ matrix.min_pullback_atr }}"
          PULLBACK_BACKTEST_C_MIN_H1_AGREEMENT: "${{ matrix.min_h1_agreement }}"
          PULLBACK_BACKTEST_C_BREAK_BUFFER_ATR: "${{ matrix.break_buffer_atr }}"
          PULLBACK_BACKTEST_C_TAKE_PROFIT_R: "${{ matrix.tp_r }}"
          PULLBACK_BACKTEST_C_MIN_BODY_ATR: "0.30"
          PULLBACK_BACKTEST_C_MIN_CLOSE_LOCATION: "0.68"
          PULLBACK_BACKTEST_OUTPUT_DIR: pullback-c-backtest-output
        run: node scripts/backtest-eurusd-pullback-c.mjs
      - name: Upload Strategy C results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eurusd-pullback-c-${{ matrix.name }}
          path: pullback-c-backtest-output/
          retention-days: 30
