name: GOLD M15 Trend Pullback Research

concurrency:
  group: gold-m15-pullback-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

on:
  pull_request:
    branches: [main]
    paths:
      - 'scripts/backtest-gold-m15-trend-pullback.mjs'
      - 'scripts/backtest-gold-m15-breakout-retest.mjs'
      - 'scripts/backtest-gold-m15-range-reversion.mjs'
      - '.github/workflows/gold-m15-pullback-research.yml'
      - 'package.json'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Find latest successful validated five-year dataset
        id: dataset
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          workflow_runs_url="https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/gold-v2-research.yml/runs?status=success&per_page=20"
          run_ids="$(curl --fail --silent --show-error \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            "${workflow_runs_url}" | jq -r '.workflow_runs[] | select(.conclusion == "success") | .id')"
          for run_id in ${run_ids}; do
            artifacts="$(curl --fail --silent --show-error \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}/artifacts?per_page=100")"
            artifact_name="$(printf '%s' "${artifacts}" | jq -r '.artifacts[] | select(.name == "gold-xauusd-m5-1825d" and .expired == false) | .name' | head -n 1)"
            if [[ "${artifact_name}" == "gold-xauusd-m5-1825d" ]]; then
              echo "run_id=${run_id}" >> "${GITHUB_OUTPUT}"
              echo "Using prepared dataset from research run ${run_id}"
              exit 0
            fi
          done
          echo "No unexpired gold-xauusd-m5-1825d artifact found. Run .github/workflows/gold-v2-research.yml successfully first." >&2
          exit 1
      - name: Download validated five-year dataset
        uses: actions/download-artifact@v4
        with:
          name: gold-xauusd-m5-1825d
          path: gold-xauusd-data
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ steps.dataset.outputs.run_id }}
      - name: Validate five-year dataset and manifest
        run: |
          set -euo pipefail
          test -s gold-xauusd-data/xauusd-m5.json.gz
          test -s gold-xauusd-data/xauusd_m5_manifest.json
          gzip -t gold-xauusd-data/xauusd-m5.json.gz
          jq -e '
            .instrument == "XAUUSD" and
            .provider == "Dukascopy Historical Data Feed" and
            .requested_start_date_utc == "2021-10-06" and
            .requested_end_date_exclusive_utc == "2026-10-05"
          ' gold-xauusd-data/xauusd_m5_manifest.json
      - name: Validate M15 backtester and M1/M5 aggregation
        run: |
          node --check scripts/backtest-gold-m15-trend-pullback.mjs
          node --check scripts/backtest-gold-m15-breakout-retest.mjs
          node --check scripts/backtest-gold-m15-range-reversion.mjs
          node scripts/backtest-gold-m15-trend-pullback.mjs --self-test
          node scripts/backtest-gold-m15-breakout-retest.mjs --self-test
          node scripts/backtest-gold-m15-range-reversion.mjs --self-test
      - name: Run fixed five-year and recent-730-day M15 pullback tests on validated M5 history
        env:
          GOLD_M15_PULLBACK_DATA_FILE: gold-xauusd-data/xauusd-m5.json.gz
          GOLD_M15_PULLBACK_DATA_TIMEFRAME: m5
          GOLD_M15_PULLBACK_OUTPUT_DIR: gold-m15-trend-pullback-output
          GOLD_PULLBACK_INITIAL_EQUITY: '100000'
          GOLD_PULLBACK_RISK_PCT: '0.25'
          GOLD_RESEARCH_END_UTC: '2026-10-05T00:00:00Z'
        run: node scripts/backtest-gold-m15-trend-pullback.mjs
      - name: Upload M15 pullback research results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gold-m15-trend-pullback-research
          path: gold-m15-trend-pullback-output/
          retention-days: 30
          if-no-files-found: warn

      - name: Run fixed five-year and recent-730-day M15 breakout-retest tests
        env:
          GOLD_M15_BREAKOUT_RETEST_DATA_FILE: gold-xauusd-data/xauusd-m5.json.gz
          GOLD_M15_BREAKOUT_RETEST_DATA_TIMEFRAME: m5
          GOLD_M15_BREAKOUT_RETEST_OUTPUT_DIR: gold-m15-breakout-retest-output
          GOLD_BREAKOUT_RETEST_INITIAL_EQUITY: '100000'
          GOLD_BREAKOUT_RETEST_RISK_PCT: '0.25'
          GOLD_RESEARCH_END_UTC: '2026-10-05T00:00:00Z'
        run: node scripts/backtest-gold-m15-breakout-retest.mjs
      - name: Upload M15 breakout-retest research results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gold-m15-breakout-retest-research
          path: gold-m15-breakout-retest-output/
          retention-days: 30
          if-no-files-found: warn

      - name: Run fixed five-year and recent-730-day M15 range-reversion tests
        env:
          GOLD_M15_RANGE_REVERSION_DATA_FILE: gold-xauusd-data/xauusd-m5.json.gz
          GOLD_M15_RANGE_REVERSION_OUTPUT_DIR: gold-m15-range-reversion-output
          GOLD_RANGE_REVERSION_INITIAL_EQUITY: '100000'
          GOLD_RANGE_REVERSION_RISK_PCT: '0.25'
          GOLD_RESEARCH_END_UTC: '2026-10-05T00:00:00Z'
        run: node scripts/backtest-gold-m15-range-reversion.mjs
      - name: Upload M15 range-reversion research results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gold-m15-range-reversion-research
          path: gold-m15-range-reversion-output/
          retention-days: 30
          if-no-files-found: warn
