name: EURUSD London ORB Research

on:
  workflow_dispatch:
  pull_request:
    branches: [main]

jobs:
  backtest:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: strict
            range_min_atr: "0.20"
            range_max_atr: "1.50"
            breakout_atr: "0.10"
            body_atr: "0.35"
            close_location: "0.70"
            buy_rsi_min: "50"
            buy_rsi_max: "68"
            sell_rsi_min: "32"
            sell_rsi_max: "50"
          - name: balanced
            range_min_atr: "0.15"
            range_max_atr: "1.75"
            breakout_atr: "0.07"
            body_atr: "0.30"
            close_location: "0.65"
            buy_rsi_min: "48"
            buy_rsi_max: "70"
            sell_rsi_min: "30"
            sell_rsi_max: "52"
          - name: opportunity
            range_min_atr: "0.10"
            range_max_atr: "2.00"
            breakout_atr: "0.05"
            body_atr: "0.25"
            close_location: "0.60"
            buy_rsi_min: "47"
            buy_rsi_max: "72"
            sell_rsi_min: "28"
            sell_rsi_max: "53"
          - name: narrow-range
            range_min_atr: "0.10"
            range_max_atr: "1.25"
            breakout_atr: "0.07"
            body_atr: "0.30"
            close_location: "0.65"
            buy_rsi_min: "48"
            buy_rsi_max: "70"
            sell_rsi_min: "30"
            sell_rsi_max: "52"
          - name: high-confirmation
            range_min_atr: "0.20"
            range_max_atr: "1.75"
            breakout_atr: "0.07"
            body_atr: "0.40"
            close_location: "0.70"
            buy_rsi_min: "50"
            buy_rsi_max: "68"
            sell_rsi_min: "32"
            sell_rsi_max: "50"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - name: Unit tests
        run: npm test
      - name: 5-year London ORB backtest
        env:
          BACKTEST_LOOKBACK_DAYS: "1825"
          BACKTEST_INITIAL_EQUITY: "100000"
          BACKTEST_RISK_PCT: "0.25"
          BACKTEST_SPREAD_PIPS: "0.8"
          BACKTEST_SLIPPAGE_PIPS: "0.1"
          BACKTEST_MIN_STOP_ATR: "0.50"
          BACKTEST_MAX_STOP_ATR: "1.50"
          BACKTEST_MAX_SPREAD_PIPS: "1.20"
          BACKTEST_MAX_SPREAD_TO_TP_PCT: "12"
          BACKTEST_MAX_DAILY_LOSS_PCT: "2"
          BACKTEST_MAX_DRAWDOWN_PCT: "5"
          BACKTEST_BREAKOUT_MIN_ATR: ${{ matrix.breakout_atr }}
          BACKTEST_BREAKOUT_MIN_BODY_ATR: ${{ matrix.body_atr }}
          BACKTEST_BREAKOUT_MIN_CLOSE_LOCATION: ${{ matrix.close_location }}
          BACKTEST_MIN_RANGE_ATR: ${{ matrix.range_min_atr }}
          BACKTEST_MAX_RANGE_ATR: ${{ matrix.range_max_atr }}
          BACKTEST_BREAKOUT_BUY_RSI_MIN: ${{ matrix.buy_rsi_min }}
          BACKTEST_BREAKOUT_BUY_RSI_MAX: ${{ matrix.buy_rsi_max }}
          BACKTEST_BREAKOUT_SELL_RSI_MIN: ${{ matrix.sell_rsi_min }}
          BACKTEST_BREAKOUT_SELL_RSI_MAX: ${{ matrix.sell_rsi_max }}
          BACKTEST_MIN_VOLUME_RATIO: "1.05"
          BACKTEST_REQUIRE_VOLUME: "true"
          BACKTEST_OUTPUT_DIR: backtest-output
        run: node scripts/backtest-eurusd-london-orb.mjs
      - name: Upload research artifact
        uses: actions/upload-artifact@v4
        with:
          name: eurusd-london-orb-${{ matrix.name }}
          path: backtest-output/
          retention-days: 30
