name: GOLD H1 M5 Halfback V2 IS Screen

on:
  push:
    branches:
      - 'feat/gold-h1-m5-halfback-v2-ema20'
    paths:
      - '.github/workflows/gold-h1-m5-halfback-v2-is-screen.yml'
      - 'scripts/backtest-gold-v2.mjs'
      - 'src/gold_h1_m5_halfback_v2.js'
      - 'tests/gold_h1_m5_halfback_v1.test.js'
  workflow_dispatch:
    inputs:
      source_run_id:
        description: Successful GOLD V2 Five-Year Research run ID; blank selects the latest successful run
        required: false
        default: ''
        type: string

jobs:
  halfback-v2-is-screen:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      GOLD_BACKTEST_STRATEGY_VARIANT: halfback_v2
      GOLD_BACKTEST_LOOKBACK_DAYS: '1095'
      GOLD_BACKTEST_START_UTC: '2021-10-06T00:00:00Z'
      GOLD_BACKTEST_END_UTC: '2024-10-05T00:00:00Z'
      GOLD_BACKTEST_INITIAL_EQUITY: '100000'
      GOLD_BACKTEST_RISK_PCT: '0.25'
      GOLD_BACKTEST_SPREAD_PRICE: '0.50'
      GOLD_BACKTEST_SLIPPAGE_PRICE: '0.05'
      GOLD_BACKTEST_OUTPUT_DIR: gold-halfback-v2-is-output
      GOLD_BACKTEST_DATA_FILE: gold-xauusd-data-is/xauusd-m5-is.json.gz
      GOLD_HALFBACK_RETRACE_MIN: '0.45'
      GOLD_HALFBACK_RETRACE_MAX: '0.55'
      GOLD_HALFBACK_SWING_LEFT_BARS: '2'
      GOLD_HALFBACK_SWING_RIGHT_BARS: '2'
      GOLD_HALFBACK_MIN_IMPULSE_ATR: '1.5'
      GOLD_HALFBACK_MAX_IMPULSE_BARS: '40'
      GOLD_HALFBACK_TAKE_PROFIT_R: '2.0'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Resolve source GOLD V2 research run
        id: source
        env:
          INPUT_RUN_ID: ${{ inputs.source_run_id }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if [ -n "${INPUT_RUN_ID:-}" ]; then
            RUN_ID="$INPUT_RUN_ID"
          else
            RUN_ID="$(gh run list \
              --workflow 'GOLD V2 Five-Year Research' \
              --limit 50 \
              --json databaseId,status,conclusion \
              --jq '[.[] | select(.status == "completed" and .conclusion == "success") | .databaseId] | .[0]')"
          fi
          if [ -z "$RUN_ID" ] || [ "$RUN_ID" = "null" ]; then
            echo "No successful GOLD V2 Five-Year Research run found." >&2
            exit 1
          fi
          echo "Using source research run: $RUN_ID"
          echo "run_id=$RUN_ID" >> "$GITHUB_OUTPUT"

      - name: Download prepared five-year XAUUSD dataset
        uses: actions/download-artifact@v4
        with:
          name: gold-xauusd-m5-1825d
          path: gold-xauusd-data
          run-id: ${{ steps.source.outputs.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Prepare the frozen three-year IS dataset
        run: |
          python3 - <<'PY'
          import datetime as dt
          import gzip
          import json
          from pathlib import Path

          source = Path("gold-xauusd-data/xauusd-m5.json.gz")
          output = Path("gold-xauusd-data-is/xauusd-m5-is.json.gz")
          start = int(dt.datetime.fromisoformat("2021-10-06T00:00:00+00:00").timestamp())
          end = int(dt.datetime.fromisoformat("2024-10-05T00:00:00+00:00").timestamp())
          with gzip.open(source, "rt", encoding="utf-8") as fh:
              bars = json.load(fh)
          selected = [bar for bar in bars if start <= int(bar["time"]) < end]
          if len(selected) < 200000:
              raise SystemExit(f"Insufficient IS bars after fixed-window trim: {len(selected)}")
          output.parent.mkdir(parents=True, exist_ok=True)
          with gzip.open(output, "wt", encoding="utf-8") as fh:
              json.dump(selected, fh, separators=(",", ":"))
          print(json.dumps({
              "window_start_utc": dt.datetime.fromtimestamp(selected[0]["time"], dt.timezone.utc).isoformat(),
              "window_end_exclusive_utc": dt.datetime.fromtimestamp(selected[-1]["time"] + 300, dt.timezone.utc).isoformat(),
              "m5_rows": len(selected),
              "artifact": str(output)
          }, indent=2))

      - name: Unit and safety tests
        run: npm test

      - name: Syntax checks
        run: |
          node --check src/gold_h1_m5_halfback_v2.js
          node --check scripts/backtest-gold-v2.mjs

      - name: Run the fixed IS-only screen with two cost scenarios
        run: node scripts/backtest-gold-v2.mjs

      - name: Verify IS screen report contract
        run: |
          node <<'NODE'
          const fs = require('fs');
          const report = JSON.parse(fs.readFileSync('gold-halfback-v2-is-output/gold_halfback_v1_backtest_report.json'));
          if (report.strategy_variant !== 'halfback_v2') throw new Error('Wrong strategy variant');
          if (new Date(report.test_period.requested_start).toISOString() !== '2021-10-06T00:00:00.000Z') throw new Error('Unexpected IS start');
          if (new Date(report.test_period.requested_end).toISOString() !== '2024-10-05T00:00:00.000Z') throw new Error('Unexpected IS end');
          for (const name of ['baseline', 'conservative']) {
            const result = report.results[name];
            if (!result || !Number.isFinite(Number(result.summary?.profit_factor))) throw new Error('Missing metrics for ' + name);
          }
          console.log('HALFBACK V2 FIXED IS SCREEN PASS');
          console.log(JSON.stringify({
            strategy_variant: report.strategy_variant,
            test_period: report.test_period,
            baseline: report.results.baseline.summary,
            conservative: report.results.conservative.summary,
            baseline_quality_gate: report.results.baseline.qualityGate,
            conservative_quality_gate: report.results.conservative.qualityGate
          }, null, 2));
          NODE

      - name: Upload IS screen artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gold-h1-m5-halfback-v2-is-screen
          path: gold-halfback-v2-is-output/
          if-no-files-found: warn
          retention-days: 30
