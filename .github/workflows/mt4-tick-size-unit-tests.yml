name: MT4 Tick Size Unit Safety

on:
  pull_request:
    branches: [main]
    paths:
      - 'mt4/GoldAITraderV18.mq4'
      - 'src/risk.js'
      - 'tests/core.test.js'
      - 'tests/mt4_gold_bridge_static.test.js'
      - '.github/workflows/mt4-tick-size-unit-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  risk-unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Test risk sizing and MT4 bridge units
        run: node --test tests/core.test.js tests/mt4_gold_bridge_static.test.js
