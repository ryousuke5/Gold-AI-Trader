name: GOLD M5 EMA20 Pullback Breakout V1 IS Screen

on:
  push:
    branches:
      - feat/gold-m5-ema20-pullback-breakout-v1
    paths:
      - 'src/gold_m5_ema20_pullback_breakout_v1.js'
      - 'tests/gold_m5_ema20_pullback_breakout_v1.test.js'
      - 'scripts/backtest-gold-v2.mjs'
      - '.github/workflows/gold-m5-ema20-pullback-breakout-v1-is-screen.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: gold-m5-ema20-pullback-breakout-v1-is-screen
  cancel-in-progress: true

jobs:
  is-screen:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      GOLD_BACKTEST_STRATEGY_VARIANT: ema20_pullback_breakout_v1
      GOLD_BACKTEST_IS_ONLY: 'true'
      GOLD_BACKTEST_ALLOWED_SIDE: BUY
      GOLD_BACKTEST_LOOKBACK_DAYS: '1825'
      GOLD_BACKTEST_END_UTC: '2026-10-05T23:59:59Z'
      GOLD_BACKTEST_DATA_FILE: gold-xauusd-data/xauusd-m5.json.gz
      GOLD_BACKTEST_INITIAL_EQUITY: '100000'
      GOLD_BACKTEST_RISK_PCT: '0.25'
      GOLD_BACKTEST_SPREAD_PRICE: '0.50'
      GOLD_BACKTEST_SLIPPAGE_PRICE: '0.05'
      GOLD_BACKTEST_MAX_DAILY_LOSS_PCT: '2'
      GOLD_BACKTEST_MAX_DRAWDOWN_PCT: '5'
      GOLD_BACKTEST_MAX_HOLD_BARS: '96'
      GOLD_BACKTEST_MAX_ENTRY_GAP_ATR: '0.50'
      GOLD_BACKTEST_OUTPUT_DIR: gold-m5-ema20-pullback-breakout-v1-is-output
      GOLD_BACKTEST_SOURCE_DATA_RUN_ID: '45761941852'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Download the already validated five-year XAUUSD M5 dataset
        uses: actions/download-artifact@v4
        with:
          name: gold-xauusd-m5-1825d
          run-id: ${{ env.GOLD_BACKTEST_SOURCE_DATA_RUN_ID }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: gold-xauusd-data

      - name: Verify the pinned dataset manifest and SHA-256
        run: |
          python3 - <<'PY'
          import gzip
          import hashlib
          import json
          from pathlib import Path

          root = Path("gold-xauusd-data")
          manifest = json.loads((root / "xauusd_m5_manifest.json").read_text())
          data = root / "xauusd-m5.json.gz"
          digest = hashlib.sha256(data.read_bytes()).hexdigest()

          assert manifest["instrument"] == "XAUUSD"
          assert manifest["requested_start_date_utc"] == "2021-10-06"
          assert manifest["requested_end_date_exclusive_utc"] == "2026-10-05"
          assert manifest["chunk_count"] == 131
          assert manifest["m5_rows"] == 353888
          assert manifest["duplicate_timestamps_removed"] == 0
          assert digest == manifest["output_sha256"]

          with gzip.open(data, "rt", encoding="utf-8") as fh:
              bars = json.load(fh)
          assert len(bars) == manifest["m5_rows"]
          assert bars[0]["time"] >= 1633478400
          assert bars[-1]["time"] < 1791158400
          print(json.dumps({
              "dataset": "VERIFIED",
              "m5_rows": len(bars),
              "chunk_count": manifest["chunk_count"],
              "date_range_utc": [
                  manifest["requested_start_date_utc"],
                  manifest["requested_end_date_exclusive_utc"]
              ],
              "duplicate_timestamps_removed": manifest["duplicate_timestamps_removed"],
              "non_weekend_gaps_gt_15m": manifest["non_weekend_gaps_gt_15m"],
              "max_m5_gap_seconds": manifest["max_m5_gap_seconds"],
              "gzip_sha256": digest
          }, indent=2))
          PY

      - name: Run complete unit and safety test suite
        run: npm test

      - name: Syntax checks
        run: |
          node --check src/gold_m5_ema20_pullback_breakout_v1.js
          node --check scripts/backtest-gold-v2.mjs

      - name: Run fixed 3-year IS-only screen with baseline and conservative costs
        run: node scripts/backtest-gold-v2.mjs

      - name: Verify IS-only report contract and expose data-gap exits
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const reportPath = 'gold-m5-ema20-pullback-breakout-v1-is-output/gold_m5_ema20_pullback_breakout_v1_backtest_report.json';
          const r = JSON.parse(fs.readFileSync(reportPath, 'utf8'));
          if (r.strategy_variant !== 'ema20_pullback_breakout_v1') throw new Error('Wrong strategy variant');
          if (r.evaluation_mode !== 'IS_ONLY_CANDIDATE_SCREEN') throw new Error('Report is not IS-only');
          if (r.oos_prices_used_for_signal_generation !== false) throw new Error('OOS data was used for signal generation');
          if (r.data_source?.m5 !== 'PREPARED_DUKASCOPY_XAUUSD') throw new Error('Unexpected M5 data source');
          if (r.assumptions?.direction_filter_for_research_only !== 'BUY') throw new Error('Research side must be BUY-only');
          if (r.strategy_parameters?.rangeLookback !== 80) throw new Error('Bounded recent-M5 history setting is missing');
          if (r.strategy_parameters?.recentM5HistoryBars !== 7) throw new Error('EMA20 seven-bar history optimization is missing');
          const output = {};
          for (const scenario of ['baseline', 'conservative']) {
            const result = r.results?.[scenario];
            if (!result || !Number.isFinite(Number(result.signals_evaluated))) {
              throw new Error('Missing scenario or signal count: ' + scenario);
            }
            for (const key of ['trades', 'profit_factor', 'expectancy_R', 'max_drawdown_pct']) {
              if (!Number.isFinite(Number(result.summary?.[key]))) {
                throw new Error('Missing metric ' + key + ' in ' + scenario);
              }
            }
            if (result.candidates_sell !== 0) throw new Error('BUY-only strategy produced SELL candidates');
            const gapExit = result.outcome_diagnostics?.actual?.by_exit_reason
              ?.find(item => item.group === 'DATA_GAP');
            output[scenario] = {
              summary: result.summary,
              quality_gate: result.qualityGate,
              data_gap_exits: gapExit?.trades ?? 0,
              exit_reasons: result.outcome_diagnostics?.actual?.by_exit_reason ?? []
            };
          }
          console.log('EMA20 PULLBACK BREAKOUT V1 IS-ONLY REPORT CONTRACT PASS');
          console.log(JSON.stringify({
            strategy: r.strategy,
            strategy_parameters: r.strategy_parameters,
            test_period: r.test_period,
            evaluation_mode: r.evaluation_mode,
            oos_prices_used_for_signal_generation: r.oos_prices_used_for_signal_generation,
            baseline: output.baseline,
            conservative: output.conservative
          }, null, 2));
          NODE

      - name: Upload IS-only research artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gold-m5-ema20-pullback-breakout-v1-is-only-results
          path: gold-m5-ema20-pullback-breakout-v1-is-output/
          retention-days: 30
          if-no-files-found: warn
