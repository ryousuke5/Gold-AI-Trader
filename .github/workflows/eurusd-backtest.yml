name: EURUSD Backtest

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'src/eurusd_strategy_a.js'
      - 'src/eurusd_strategy_c.js'
      - 'scripts/backtest-eurusd*.mjs'
      - 'scripts/backtest-eurusd*.js'
      - 'mt4/EURUSDAIMonitor.mq4'
      - 'mt4/EURUSDTrendPullbackMonitor.mq4'
      - 'tests/eurusd_*.test.js'
      - '.github/workflows/eurusd-backtest.yml'
  pull_request:
    branches: [main]
    paths:
      - 'src/eurusd_strategy_a.js'
      - 'src/eurusd_strategy_c.js'
      - 'scripts/backtest-eurusd*.mjs'
      - 'scripts/backtest-eurusd*.js'
      - 'mt4/EURUSDAIMonitor.mq4'
      - 'mt4/EURUSDTrendPullbackMonitor.mq4'
      - 'tests/eurusd_*.test.js'
      - '.github/workflows/eurusd-backtest.yml'

jobs:
  backtest:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: current
            range_lookback: "6"
            min_range_atr: "0.75"
            max_range_atr: "2.00"
            breakout_min_atr: "0.10"
            breakout_min_body_atr: "0.35"
            breakout_min_close_location: "0.70"
            buy_rsi_min: "50"
            buy_rsi_max: "68"
            sell_rsi_min: "32"
            sell_rsi_max: "50"
          - name: balanced-weekly
            range_lookback: "5"
            min_range_atr: "0.50"
            max_range_atr: "2.50"
            breakout_min_atr: "0.05"
            breakout_min_body_atr: "0.25"
            breakout_min_close_location: "0.60"
            buy_rsi_min: "48"
            buy_rsi_max: "70"
            sell_rsi_min: "30"
            sell_rsi_max: "52"
          - name: frequent
            range_lookback: "4"
            min_range_atr: "0.50"
            max_range_atr: "2.50"
            breakout_min_atr: "0.05"
            breakout_min_body_atr: "0.20"
            breakout_min_close_location: "0.58"
            buy_rsi_min: "47"
            buy_rsi_max: "72"
            sell_rsi_min: "28"
            sell_rsi_max: "53"
          - name: compromise-lookback4
            range_lookback: "4"
            min_range_atr: "0.50"
            max_range_atr: "2.50"
            breakout_min_atr: "0.05"
            breakout_min_body_atr: "0.25"
            breakout_min_close_location: "0.60"
            buy_rsi_min: "48"
            buy_rsi_max: "70"
            sell_rsi_min: "30"
            sell_rsi_max: "52"
          - name: compromise-body20
            range_lookback: "5"
            min_range_atr: "0.50"
            max_range_atr: "2.50"
            breakout_min_atr: "0.05"
            breakout_min_body_atr: "0.20"
            breakout_min_close_location: "0.60"
            buy_rsi_min: "48"
            buy_rsi_max: "70"
            sell_rsi_min: "30"
            sell_rsi_max: "52"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - name: Run unit tests
        run: npm test
      - name: Static validate EURUSD MT4 monitor
        run: npm run test:mt4
      - name: Run 2-year technical backtest
        env:
          BACKTEST_LOOKBACK_DAYS: "1825"
          BACKTEST_INITIAL_EQUITY: "100000"
          BACKTEST_RISK_PCT: "0.25"
          BACKTEST_SPREAD_PIPS: "0.8"
          BACKTEST_SLIPPAGE_PIPS: "0.1"
          BACKTEST_MIN_STOP_ATR: "0.50"
          BACKTEST_MAX_STOP_ATR: "1.50"
          BACKTEST_MIN_RR: "1.80"
          BACKTEST_MAX_SPREAD_PIPS: "1.20"
          BACKTEST_MAX_SPREAD_TO_TP_PCT: "12"
          BACKTEST_MAX_DAILY_LOSS_PCT: "2"
          BACKTEST_MAX_DRAWDOWN_PCT: "5"
          BACKTEST_FREQUENCY_MODE: ${{ matrix.name }}
          BACKTEST_TARGET_TRADES_PER_WEEK: "1"
          BACKTEST_RANGE_LOOKBACK: ${{ matrix.range_lookback }}
          BACKTEST_MIN_RANGE_ATR: ${{ matrix.min_range_atr }}
          BACKTEST_MAX_RANGE_ATR: ${{ matrix.max_range_atr }}
          BACKTEST_BREAKOUT_MIN_ATR: ${{ matrix.breakout_min_atr }}
          BACKTEST_BREAKOUT_MIN_BODY_ATR: ${{ matrix.breakout_min_body_atr }}
          BACKTEST_BREAKOUT_MIN_CLOSE_LOCATION: ${{ matrix.breakout_min_close_location }}
          BACKTEST_BREAKOUT_BUY_RSI_MIN: ${{ matrix.buy_rsi_min }}
          BACKTEST_BREAKOUT_BUY_RSI_MAX: ${{ matrix.buy_rsi_max }}
          BACKTEST_BREAKOUT_SELL_RSI_MIN: ${{ matrix.sell_rsi_min }}
          BACKTEST_BREAKOUT_SELL_RSI_MAX: ${{ matrix.sell_rsi_max }}
          BACKTEST_OUTPUT_DIR: backtest-output
        run: node scripts/backtest-eurusd.mjs
      - name: Upload backtest artifacts
        uses: actions/upload-artifact@v4
        with:
          name: eurusd-backtest-${{ matrix.name }}
          path: backtest-output/
          retention-days: 30
