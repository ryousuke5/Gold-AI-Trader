name: GOLD Forward Shadow Telemetry Tests

on:
  push:
    branches:
      - research/gold-forward-loss-telemetry-20261114
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  telemetry-unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Check API and telemetry module syntax
        run: |
          node --check server.js
          node --check src/gold_forward_shadow_telemetry.js
      - name: Run full repository test suite
        run: npm test
