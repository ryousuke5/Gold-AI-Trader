name: GOLD V3 Opening-Range Research

on:
  pull_request:
    branches: [main]
    paths:
      - 'research/gold-v3-opening-range-research.py'
      - '.github/workflows/gold-v3-opening-range-research.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  opening-range-research:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GOLD_V3_ORB_DATA_FILE: ${{ github.workspace }}/gold-xauusd-data/xauusd-m5.json.gz
      GOLD_V3_ORB_OUTPUT_DIR: ${{ github.workspace }}/gold-v3-opening-range-output
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install research dependencies
        run: python -m pip install --disable-pip-version-check numpy pandas

      - name: Find latest successful prepared five-year dataset
        id: dataset
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          runs_url="https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/gold-v2-research.yml/runs?status=success&per_page=20"
          run_ids="$(curl --fail --silent --show-error \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" "${runs_url}" |
            jq -r '.workflow_runs[] | select(.conclusion == "success") | .id')"

          for run_id in ${run_ids}; do
            artifacts="$(curl --fail --silent --show-error \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}/artifacts?per_page=100")"
            name="$(printf '%s' "${artifacts}" |
              jq -r '.artifacts[] | select(.name == "gold-xauusd-m5-1825d" and .expired == false) | .name' |
              head -n 1)"
            if [[ "${name}" == "gold-xauusd-m5-1825d" ]]; then
              echo "run_id=${run_id}" >> "${GITHUB_OUTPUT}"
              echo "Using validated prepared data from research run ${run_id}"
              exit 0
            fi
          done

          echo "No unexpired gold-xauusd-m5-1825d artifact found in recent successful research runs." >&2
          exit 1

      - name: Download prepared data
        uses: actions/download-artifact@v4
        with:
          name: gold-xauusd-m5-1825d
          path: gold-xauusd-data
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ steps.dataset.outputs.run_id }}

      - name: Validate source data
        run: |
          set -euo pipefail
          test -s gold-xauusd-data/xauusd-m5.json.gz
          test -s gold-xauusd-data/xauusd_m5_manifest.json
          gzip -t gold-xauusd-data/xauusd-m5.json.gz
          jq -e '
            .instrument == "XAUUSD" and
            .provider == "Dukascopy Historical Data Feed" and
            .requested_start_date_utc == "2021-10-06" and
            .requested_end_date_exclusive_utc == "2026-10-05"
          ' gold-xauusd-data/xauusd_m5_manifest.json
          echo "Prepared dataset manifest and gzip integrity passed."

      - name: Syntax check and run fixed-rule study
        run: |
          python -m py_compile research/gold-v3-opening-range-research.py
          python research/gold-v3-opening-range-research.py

      - name: Validate result contract
        run: |
          python - <<'PY'
          import json, os
          p = os.path.join(os.environ["GOLD_V3_ORB_OUTPUT_DIR"], "gold-v3-opening-range-development.json")
          with open(p, encoding="utf-8") as f:
              d = json.load(f)
          assert d["status"] == "RESEARCH_ONLY_FIXED_RULES"
          assert d["data"]["bars"] >= 300000
          assert d["frozen_rules"]["threshold_sweep"] is False
          assert "holdout" in d["scenarios"]["baseline"]
          assert "holdout" in d["scenarios"]["conservative"]
          for cost in ("baseline", "conservative"):
              result = d["scenarios"][cost]["holdout"]
              assert result["summary"]["trades"] > 0
              assert "full_split_result_valid" in result
              assert result["censor"] is None or not result["full_split_result_valid"]
          print("GOLD V3 fixed-rule research artifact contract passed.")
          PY

      - name: Upload research artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gold-v3-opening-range-research
          path: gold-v3-opening-range-output/
          if-no-files-found: warn
          retention-days: 30
