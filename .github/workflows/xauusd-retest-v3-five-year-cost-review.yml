# Research checkpoint: Bid/Ask-correct stop geometry patch (research branch only).
name: XAUUSD Retest V3 Five-Year Cost Review

on:
  push:
    branches: [research/xauusd-retest-v3-five-year-cost-review]
    paths:
      - '.github/workflows/xauusd-retest-v3-five-year-cost-review.yml'
      - 'scripts/backtest-xauusd-retest-v3.mjs'
      - 'src/xauusd_retest_v3.js'
      - 'tests/xauusd_retest_v3.test.js'
      - 'scripts/fetch-xauusd-m5-chunk.py'
      - 'scripts/assemble-xauusd-m5.py'
      - 'config/gold-v2-data-window.json'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: xauusd-retest-v3-five-year-cost-review
  cancel-in-progress: true

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      chunks: ${{ steps.plan.outputs.chunks }}
      start_date: ${{ steps.plan.outputs.start_date }}
      end_date: ${{ steps.plan.outputs.end_date }}
      cache_version: ${{ steps.plan.outputs.cache_version }}
    steps:
      - uses: actions/checkout@v4
      - name: Build fixed five-year 14-day chunk plan
        id: plan
        run: |
          python3 - <<'PY'
          import json, os
          from datetime import date, timedelta

          with open("config/gold-v2-data-window.json", "r", encoding="utf-8") as fh:
              cfg = json.load(fh)
          lookback_days = int(cfg["lookback_days"])
          chunk_days = int(cfg["chunk_days"])
          end_day = date.fromisoformat(str(cfg["end_date_utc"]))
          if lookback_days != 1825 or chunk_days < 1 or chunk_days > 31:
              raise SystemExit("Unexpected fixed research window configuration")
          start_day = end_day - timedelta(days=lookback_days)
          chunks, cursor, idx = [], start_day, 1
          while cursor < end_day:
              end = min(cursor + timedelta(days=chunk_days), end_day)
              chunks.append({
                  "index": idx, "id": f"{cursor:%Y%m%d}_{end:%Y%m%d}",
                  "start": cursor.isoformat(), "end": end.isoformat()
              })
              cursor, idx = end, idx + 1
          if len(chunks) > 256:
              raise SystemExit(f"Unexpected chunk count: {len(chunks)}")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as fh:
              fh.write(f"chunks={json.dumps(chunks, separators=(',', ':'))}\n")
              fh.write(f"start_date={start_day.isoformat()}\n")
              fh.write(f"end_date={end_day.isoformat()}\n")
              fh.write(f"cache_version={cfg['cache_version']}\n")
          print(json.dumps({
              "lookback_days": lookback_days, "chunk_days": chunk_days,
              "chunk_count": len(chunks), "cache_version": cfg["cache_version"],
              "start_date": start_day.isoformat(), "end_date_exclusive": end_day.isoformat()
          }, indent=2))
          PY

  prepare-chunks:
    needs: [plan, validate]
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix:
        chunk: ${{ fromJSON(needs.plan.outputs.chunks) }}
    steps:
      - uses: actions/checkout@v4
      - name: Restore completed M5 chunk
        id: m5cache
        uses: actions/cache/restore@v4
        with:
          path: |
            gold-xauusd-data/chunks/xauusd-m5-${{ matrix.chunk.id }}.json.gz
            gold-xauusd-data/chunks/xauusd-m5-${{ matrix.chunk.id }}.manifest.json
          key: xauusd-m5-${{ needs.plan.outputs.cache_version }}-${{ runner.os }}-${{ matrix.chunk.id }}
      - name: Restore raw M1 checkpoint
        if: steps.m5cache.outputs.cache-hit != 'true'
        id: m1cache
        uses: actions/cache/restore@v4
        with:
          path: gold-xauusd-data/raw/${{ matrix.chunk.id }}
          key: xauusd-m1-${{ needs.plan.outputs.cache_version }}-${{ runner.os }}-${{ matrix.chunk.id }}-${{ github.run_id }}
          restore-keys: |
            xauusd-m1-${{ needs.plan.outputs.cache_version }}-${{ runner.os }}-${{ matrix.chunk.id }}-
      - name: Prepare chunk directories
        run: |
          mkdir -p "gold-xauusd-data/raw/${{ matrix.chunk.id }}"
          mkdir -p gold-xauusd-data/chunks
      - name: Validate downloader
        if: steps.m5cache.outputs.cache-hit != 'true'
        run: python3 scripts/fetch-xauusd-m5-chunk.py --self-test
      - name: Download or resume this 14-day chunk
        if: steps.m5cache.outputs.cache-hit != 'true'
        run: |
          python3 scripts/fetch-xauusd-m5-chunk.py \
            --start-date "${{ matrix.chunk.start }}" \
            --end-date "${{ matrix.chunk.end }}" \
            --cache-dir "gold-xauusd-data/raw/${{ matrix.chunk.id }}" \
            --output-file "gold-xauusd-data/chunks/xauusd-m5-${{ matrix.chunk.id }}.json.gz" \
            --manifest-file "gold-xauusd-data/chunks/xauusd-m5-${{ matrix.chunk.id }}.manifest.json" \
            --request-delay 1.5 --timeout 30 --retries 8
      - name: Save raw M1 checkpoint
        if: always() && steps.m5cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: gold-xauusd-data/raw/${{ matrix.chunk.id }}
          key: xauusd-m1-${{ needs.plan.outputs.cache_version }}-${{ runner.os }}-${{ matrix.chunk.id }}-${{ github.run_id }}
      - name: Save completed M5 chunk
        if: success() && steps.m5cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            gold-xauusd-data/chunks/xauusd-m5-${{ matrix.chunk.id }}.json.gz
            gold-xauusd-data/chunks/xauusd-m5-${{ matrix.chunk.id }}.manifest.json
          key: xauusd-m5-${{ needs.plan.outputs.cache_version }}-${{ runner.os }}-${{ matrix.chunk.id }}
      - name: Upload chunk for assembly
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: xauusd-v3-chunk-${{ matrix.chunk.id }}
          path: |
            gold-xauusd-data/chunks/xauusd-m5-${{ matrix.chunk.id }}.json.gz
            gold-xauusd-data/chunks/xauusd-m5-${{ matrix.chunk.id }}.manifest.json
          retention-days: 2
          if-no-files-found: error

  assemble-data:
    needs: [plan, prepare-chunks, validate]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Download all chunks
        uses: actions/download-artifact@v4
        with:
          pattern: xauusd-v3-chunk-*
          path: gold-xauusd-data/chunks
          merge-multiple: true
      - name: Assemble and validate five-year XAUUSD M5 dataset
        run: |
          python3 scripts/assemble-xauusd-m5.py \
            --input-dir gold-xauusd-data/chunks \
            --output-file gold-xauusd-data/xauusd-m5.json.gz \
            --manifest-file gold-xauusd-data/xauusd_m5_manifest.json \
            --start-date "${{ needs.plan.outputs.start_date }}" \
            --end-date "${{ needs.plan.outputs.end_date }}" \
            --min-bars 200000
      - name: Upload prepared five-year dataset
        uses: actions/upload-artifact@v4
        with:
          name: xauusd-v3-prepared-five-year-data
          path: |
            gold-xauusd-data/xauusd-m5.json.gz
            gold-xauusd-data/xauusd_m5_manifest.json
          retention-days: 2
          if-no-files-found: error

  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Validate strategy, EA guardrails, and unit tests
        run: |
          node scripts/validate-xauusd-retest-v3.mjs
          node --check src/xauusd_retest_v3.js
          node --check scripts/backtest-xauusd-retest-v3.mjs
          node --test tests/xauusd_retest_v3.test.js

  review:
    needs: [assemble-data, validate]
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        include:
          - name: zero_cost_000_000
            execution_spread: '0.00'
            slippage: '0.00'
          - name: baseline_055_010
            execution_spread: '0.55'
            slippage: '0.10'
          - name: spread_stress_075_010
            execution_spread: '0.75'
            slippage: '0.10'
          - name: spread_stress_100_010
            execution_spread: '1.00'
            slippage: '0.10'
          - name: slippage_stress_055_020
            execution_spread: '0.55'
            slippage: '0.20'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Download freshly prepared five-year dataset
        uses: actions/download-artifact@v4
        with:
          name: xauusd-v3-prepared-five-year-data
          path: gold-xauusd-data
      - name: Verify dataset and report digest
        run: |
          test -s gold-xauusd-data/xauusd-m5.json.gz
          sha256sum gold-xauusd-data/xauusd-m5.json.gz
      - name: Run five-year V3 backtest with isolated execution-cost scenario
        env:
          XAU_V3_DAYS: '1825'
          XAU_V3_END_UTC: '2026-10-05T00:00:00Z'
          XAU_V3_DATA_FILE: 'gold-xauusd-data/xauusd-m5.json.gz'
          XAU_V3_TIMEZONE: 'Europe/Nicosia'
          XAU_V3_SIGNAL_SPREAD_PRICE: '0.55'
          XAU_V3_SPREAD_PRICE: '${{ matrix.execution_spread }}'
          XAU_V3_SLIPPAGE_PRICE: '${{ matrix.slippage }}'
          XAU_V3_MAX_HOLD_BARS: '96'
          XAU_V3_COOLDOWN_BARS: '2'
          XAU_V3_BREAKOUT_LOOKBACK: '12'
          XAU_V3_MIN_RANGE_ATR: '0.55'
          XAU_V3_MAX_RANGE_ATR: '3.50'
          XAU_V3_BREAKOUT_ATR: '0.05'
          XAU_V3_BREAKOUT_BODY_ATR: '0.25'
          XAU_V3_BREAKOUT_CLOSE_LOCATION: '0.58'
          XAU_V3_MAX_BREAKOUT_BODY_ATR: '1.80'
          XAU_V3_MAX_RETEST_BARS: '6'
          XAU_V3_MAX_CONFIRM_BARS: '3'
          XAU_V3_RETEST_TOLERANCE_ATR: '0.25'
          XAU_V3_MAX_PENETRATION_ATR: '0.25'
          XAU_V3_RETEST_CLOSE_BUFFER_ATR: '0.08'
          XAU_V3_CONFIRM_BUFFER_ATR: '0.02'
          XAU_V3_CONFIRM_BODY_ATR: '0.20'
          XAU_V3_CONFIRM_CLOSE_LOCATION: '0.55'
          XAU_V3_MAX_CONFIRM_BODY_ATR: '1.50'
          XAU_V3_MIN_STOP_ATR: '0.60'
          XAU_V3_MAX_STOP_ATR: '2.20'
          XAU_V3_STOP_BUFFER_ATR: '0.12'
          XAU_V3_TAKE_PROFIT_R: '1.80'
          XAU_V3_MAX_ENTRY_DISTANCE_ATR: '0.25'
          XAU_V3_MAX_EXTENSION_ATR: '1.80'
          XAU_V3_MIN_H1_AGREEMENT: '0.60'
          XAU_V3_H1_BUY_RSI_MIN: '45'
          XAU_V3_H1_BUY_RSI_MAX: '75'
          XAU_V3_H1_SELL_RSI_MIN: '25'
          XAU_V3_H1_SELL_RSI_MAX: '55'
          XAU_V3_USE_VOLUME_FILTER: 'false'
          XAU_V3_MIN_VOLUME_RATIO: '0.90'
          XAU_V3_MAX_SPREAD_PRICE: '0.60'
          XAU_V3_OUTPUT_DIR: 'xauusd-v3-five-year-output'
        run: node scripts/backtest-xauusd-retest-v3.mjs
      - name: Upload five-year result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xauusd-v3-five-year-${{ matrix.name }}
          path: xauusd-v3-five-year-output/
          retention-days: 30
          if-no-files-found: warn
