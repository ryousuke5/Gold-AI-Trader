name: XAUUSD Native M5 Probe

on:
  push:
    branches: [main]
    paths:
      - 'scripts/probe-xauusd-m5.py'
      - '.github/workflows/gold-data-probe.yml'
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Probe native XAUUSD M5
        run: python3 scripts/probe-xauusd-m5.py --date 2026-09-30
