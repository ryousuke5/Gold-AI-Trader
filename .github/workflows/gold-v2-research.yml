          python3 scripts/fetch-xauusd-m5.py --start-date "$(date -u -d "$RESEARCH_END_DATE - 1765 days" +%F)" --end-date "$(date -u -d "$RESEARCH_END_DATE - 1795 days" +%F)" --cache-dir gold-xauusd-data/raw --native-m5-cache-dir gold-xauusd-data/raw-m5 --download-only --request-delay 1.0 --workers 2 --retries 6 --rounds 2 --rescue-rounds 3 --rescue-max-backoff 60
