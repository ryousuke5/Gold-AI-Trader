name: GOLD V2 Five-Year Research

on:
  push:
    branches: [main]
    paths:
      - 'src/gold_strategy_v2.js'
      - 'scripts/backtest-gold-v2.mjs'
      - 'scripts/backtest-gold-v2-resumable.mjs'
      - 'scripts/fetch-xauusd-m5.mjs'
      - 'scripts/fetch-xauusd-m5.py'
      - 'tests/gold_strategy_v2.test.js'
      - '.github/workflows/gold-v2-research.yml'
  workflow_dispatch:

concurrency:
  group: gold-v2-research
  cancel-in-progress: false

jobs:

  prepare-data:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - name: Restore XAUUSD resumable cache
        uses: actions/cache/restore@v4
        with:
          path: |
            gold-xauusd-data/raw
            gold-xauusd-data/raw-m5
          key: xauusd-v4-${{ runner.os }}-${{ github.run_id }}-${{ github.run_attempt }}-initial
          restore-keys: |
            xauusd-v4-${{ runner.os }}-
            xauusd-v3-${{ runner.os }}-
            xauusd-m1-v2-${{ runner.os }}-

      - name: Freeze research date range
        run: |
          echo "RESEARCH_END_DATE=$(date -u +%F)" >> "$GITHUB_ENV"
          echo "RESEARCH_START_DATE=$(date -u -d '1825 days ago' +%F)" >> "$GITHUB_ENV"

      - name: Validate downloader
        run: python3 scripts/fetch-xauusd-m5.py --self-test

      - name: GOLD data checkpoint 01
        run: |
          python3 scripts/fetch-xauusd-m5.py --start-date "$(date -u -d "$RESEARCH_END_DATE - 1825 days" +%F)" --end-date "$(date -u -d "$RESEARCH_END_DATE - 1645 days" +%F)" --cache-dir gold-xauusd-data/raw --native-m5-cache-dir gold-xauusd-data/raw-m5 --download-only --request-delay 0.4 --workers 4 --retries 6 --rounds 4
      - name: Save GOLD cache checkpoint 01
        if: always()
        uses: actions/cache/save@v4
        with:
          path: |
            gold-xauusd-data/raw
            gold-xauusd-data/raw-m5
          key: xauusd-v4-${{ runner.os }}-${{ github.run_id }}-${{ github.run_attempt }}-01

      - name: GOLD data checkpoint 02
        run: |
          python3 scripts/fetch-xauusd-m5.py --start-date "$(date -u -d "$RESEARCH_END_DATE - 1645 days" +%F)" --end-date "$(date -u -d "$RESEARCH_END_DATE - 1465 days" +%F)" --cache-dir gold-xauusd-data/raw --native-m5-cache-dir gold-xauusd-data/raw-m5 --download-only --request-delay 0.4 --workers 4 --retries 6 --rounds 4
      - name: Save GOLD cache checkpoint 02
        if: always()
        uses: actions/cache/save@v4
        with:
          path: |
            gold-xauusd-data/raw
            gold-xauusd-data/raw-m5
          key: xauusd-v4-${{ runner.os }}-${{ github.run_id }}-${{ github.run_attempt }}-02

      - name: GOLD data checkpoint 03
        run: |
          python3 scripts/fetch-xauusd-m5.py --start-date "$(date -u -d "$RESEARCH_END_DATE - 1465 days" +%F)" --end-date "$(date -u -d "$RESEARCH_END_DATE - 1285 days" +%F)" --cache-dir gold-xauusd-data/raw --native-m5-cache-dir gold-xauusd-data/raw-m5 --download-only --request-delay 0.4 --workers 4 --retries 6 --rounds 4
      - name: Save GOLD cache checkpoint 03
        if: always()
        uses: actions/cache/save@v4
        with:
          path: |
            gold-xauusd-data/raw
            gold-xauusd-data/raw-m5
          key: xauusd-v4-${{ runner.os }}-${{ github.run_id }}-${{ github.run_attempt }}-03

      - name: GOLD data checkpoint 04
        run: |
          python3 scripts/fetch-xauusd-m5.py --start-date "$(date -u -d "$RESEARCH_END_DATE - 1285 days" +%F)" --end-date "$(date -u -d "$RESEARCH_END_DATE - 1105 days" +%F)" --cache-dir gold-xauusd-data/raw --native-m5-cache-dir gold-xauusd-data/raw-m5 --download-only --request-delay 0.4 --workers 4 --retries 6 --rounds 4
      - name: Save GOLD cache checkpoint 04
        if: always()
        uses: actions/cache/save@v4
        with:
          path: |
            gold-xauusd-data/raw
            gold-xauusd-data/raw-m5
          key: xauusd-v4-${{ runner.os }}-${{ github.run_id }}-${{ github.run_attempt }}-04

      - name: GOLD data checkpoint 05
        run: |
          python3 scripts/fetch-xauusd-m5.py --start-date "$(date -u -d "$RESEARCH_END_DATE - 1105 days" +%F)" --end-date "$(date -u -d "$RESEARCH_END_DATE - 925 days" +%F)" --cache-dir gold-xauusd-data/raw --native-m5-cache-dir gold-xauusd-data/raw-m5 --download-only --request-delay 0.4 --workers 4 --retries 6 --rounds 4
      - name: Save GOLD cache checkpoint 05
        if: always()
        uses: actions/cache/save@v4
        with:
          path: |
            gold-xauusd-data/raw
            gold-xauusd-data/raw-m5
          key: xauusd-v4-${{ runner.os }}-${{ github.run_id }}-${{ github.run_attempt }}-05

      - name: GOLD data checkpoint 06
        run: |
          python3 scripts/fetch-xauusd-m5.py --start-date "$(date -u -d "$RESEARCH_END_DATE - 925 days" +%F)" --end-date "$(date -u -d "$RESEARCH_END_DATE - 745 days" +%F)" --cache-dir gold-xauusd-data/raw --native-m5-cache-dir gold-xauusd-data/raw-m5 --download-only --request-delay 0.4 --workers 4 --retries 6 --rounds 4
      - name: Save GOLD cache checkpoint 06
        if: always()
        uses: actions/cache/save@v4
        with:
          path: |
            gold-xauusd-data/raw
            gold-xauusd-data/raw-m5
          key: xauusd-v4-${{ runner.os }}-${{ github.run_id }}-${{ github.run_attempt }}-06

      - name: GOLD data checkpoint 07
        run: |
          python3 scripts/fetch-xauusd-m5.py --start-date "$(date -u -d "$RESEARCH_END_DATE - 745 days" +%F)" --end-date "$(date -u -d "$RESEARCH_END_DATE - 565 days" +%F)" --cache-dir gold-xauusd-data/raw --native-m5-cache-dir gold-xauusd-data/raw-m5 --download-only --request-delay 0.4 --workers 4 --retries 6 --rounds 4
      - name: Save GOLD cache checkpoint 07
        if: always()
        uses: actions/cache/save@v4
        with:
          path: |
            gold-xauusd-data/raw
            gold-xauusd-data/raw-m5
          key: xauusd-v4-${{ runner.os }}-${{ github.run_id }}-${{ github.run_attempt }}-07

      - name: GOLD data checkpoint 08
        run: |
          python3 scripts/fetch-xauusd-m5.py --start-date "$(date -u -d "$RESEARCH_END_DATE - 565 days" +%F)" --end-date "$(date -u -d "$RESEARCH_END_DATE - 385 days" +%F)" --cache-dir gold-xauusd-data/raw --native-m5-cache-dir gold-xauusd-data/raw-m5 --download-only --request-delay 0.4 --workers 4 --retries 6 --rounds 4
      - name: Save GOLD cache checkpoint 08
        if: always()
        uses: actions/cache/save@v4
        with:
          path: |
            gold-xauusd-data/raw
            gold-xauusd-data/raw-m5
          key: xauusd-v4-${{ runner.os }}-${{ github.run_id }}-${{ github.run_attempt }}-08

      - name: GOLD data checkpoint 09
        run: |
          python3 scripts/fetch-xauusd-m5.py --start-date "$(date -u -d "$RESEARCH_END_DATE - 385 days" +%F)" --end-date "$(date -u -d "$RESEARCH_END_DATE - 205 days" +%F)" --cache-dir gold-xauusd-data/raw --native-m5-cache-dir gold-xauusd-data/raw-m5 --download-only --request-delay 0.4 --workers 4 --retries 6 --rounds 4
      - name: Save GOLD cache checkpoint 09
        if: always()
        uses: actions/cache/save@v4
        with:
          path: |
            gold-xauusd-data/raw
            gold-xauusd-data/raw-m5
          key: xauusd-v4-${{ runner.os }}-${{ github.run_id }}-${{ github.run_attempt }}-09

      - name: GOLD data checkpoint 10
        run: |
          python3 scripts/fetch-xauusd-m5.py --start-date "$(date -u -d "$RESEARCH_END_DATE - 205 days" +%F)" --end-date "$(date -u -d "$RESEARCH_END_DATE - 25 days" +%F)" --cache-dir gold-xauusd-data/raw --native-m5-cache-dir gold-xauusd-data/raw-m5 --download-only --request-delay 0.4 --workers 4 --retries 6 --rounds 4
      - name: Save GOLD cache checkpoint 10
        if: always()
        uses: actions/cache/save@v4
        with:
          path: |
            gold-xauusd-data/raw
            gold-xauusd-data/raw-m5
          key: xauusd-v4-${{ runner.os }}-${{ github.run_id }}-${{ github.run_attempt }}-10

      - name: GOLD data checkpoint 11
        run: |
          python3 scripts/fetch-xauusd-m5.py --start-date "$(date -u -d "$RESEARCH_END_DATE - 25 days" +%F)" --end-date "$RESEARCH_END_DATE" --cache-dir gold-xauusd-data/raw --native-m5-cache-dir gold-xauusd-data/raw-m5 --download-only --request-delay 0.4 --workers 4 --retries 6 --rounds 4
      - name: Save GOLD cache checkpoint 11
        if: always()
        uses: actions/cache/save@v4
        with:
          path: |
            gold-xauusd-data/raw
            gold-xauusd-data/raw-m5
          key: xauusd-v4-${{ runner.os }}-${{ github.run_id }}-${{ github.run_attempt }}-11

      - name: Build final five-year XAUUSD M5 dataset
        run: |
          python3 scripts/fetch-xauusd-m5.py --start-date "$RESEARCH_START_DATE" --end-date "$RESEARCH_END_DATE" --cache-dir gold-xauusd-data/raw --native-m5-cache-dir gold-xauusd-data/raw-m5 --output-file gold-xauusd-data/xauusd-m5.json.gz --build-only

      - name: Upload prepared XAUUSD M5 dataset
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: gold-xauusd-m5-1825d
          path: |
            gold-xauusd-data/xauusd-m5.json.gz
            gold-xauusd-data/xauusd_m5_manifest.json
          retention-days: 7
  research:
    needs: prepare-data
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: baseline
            range_lookback: "12"
            min_range_atr: "0.80"
            max_range_atr: "2.80"
            breakout_atr: "0.10"
            body_atr: "0.40"
            close_location: "0.65"
            volume_ratio: "1.10"
            session_start: "7"
            session_end: "20"
          - name: strict
            range_lookback: "12"
            min_range_atr: "0.80"
            max_range_atr: "2.50"
            breakout_atr: "0.15"
            body_atr: "0.50"
            close_location: "0.70"
            volume_ratio: "1.25"
            session_start: "7"
            session_end: "17"
          - name: loose
            range_lookback: "18"
            min_range_atr: "0.60"
            max_range_atr: "3.50"
            breakout_atr: "0.05"
            body_atr: "0.30"
            close_location: "0.60"
            volume_ratio: "1.05"
            session_start: "7"
            session_end: "22"
          - name: ny_focus
            range_lookback: "12"
            min_range_atr: "0.80"
            max_range_atr: "2.80"
            breakout_atr: "0.10"
            body_atr: "0.40"
            close_location: "0.65"
            volume_ratio: "1.10"
            session_start: "12"
            session_end: "20"

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Download prepared XAUUSD M5 dataset
        uses: actions/download-artifact@v4
        with:
          name: gold-xauusd-m5-1825d
          path: gold-xauusd-data
      - name: Run test suite
        run: npm test
      - name: Run resumable five-year XAUUSD M5 backtest
        env:
          GOLD_BACKTEST_LOOKBACK_DAYS: "1825"
          GOLD_BACKTEST_INITIAL_EQUITY: "100000"
          GOLD_BACKTEST_RISK_PCT: "0.25"
          GOLD_BACKTEST_SPREAD_PRICE: "0.50"
          GOLD_BACKTEST_SLIPPAGE_PRICE: "0.05"
          GOLD_BACKTEST_MAX_DAILY_LOSS_PCT: "2"
          GOLD_BACKTEST_MAX_DRAWDOWN_PCT: "5"
          GOLD_BACKTEST_MAX_HOLD_BARS: "96"
          GOLD_BACKTEST_MAX_ENTRY_GAP_ATR: "0.50"
          GOLD_RANGE_LOOKBACK: ${{ matrix.range_lookback }}
          GOLD_MIN_RANGE_ATR: ${{ matrix.min_range_atr }}
          GOLD_MAX_RANGE_ATR: ${{ matrix.max_range_atr }}
          GOLD_BREAKOUT_ATR: ${{ matrix.breakout_atr }}
          GOLD_MIN_BODY_ATR: ${{ matrix.body_atr }}
          GOLD_MIN_CLOSE_LOCATION: ${{ matrix.close_location }}
          GOLD_MIN_VOLUME_RATIO: ${{ matrix.volume_ratio }}
          GOLD_SESSION_START_UTC: ${{ matrix.session_start }}
          GOLD_SESSION_END_UTC: ${{ matrix.session_end }}
          GOLD_BACKTEST_DATA_FILE: gold-xauusd-data/xauusd-m5.json.gz
          GOLD_BACKTEST_OUTPUT_DIR: gold-backtest-output
        run: node scripts/backtest-gold-v2-resumable.mjs
      - name: Upload GOLD V2 results and checkpoint
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gold-v2-${{ matrix.name }}
          path: gold-backtest-output/
          retention-days: 30
          if-no-files-found: warn
