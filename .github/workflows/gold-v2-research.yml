name: GOLD V2 Five-Year Research

# Resumability: independent 14-day chunks + stable per-chunk caches.

on:
  push:
    branches: [main]
    paths:
      - 'src/gold_strategy_v2.js'
      - 'scripts/backtest-gold-v2.mjs'
      - 'scripts/backtest-gold-v2-resumable.mjs'
      - 'scripts/fetch-xauusd-m5-chunk.py'
      - 'scripts/assemble-xauusd-m5.py'
      - 'tests/gold_strategy_v2.test.js'
      - '.github/workflows/gold-v2-research.yml'
  workflow_dispatch:
    inputs:
      end_date_utc:
        description: 'UTC cutoff date (exclusive), YYYY-MM-DD. Blank = workflow start UTC date.'
        required: false
        default: ''

concurrency:
  group: gold-v2-research-v3
  cancel-in-progress: true

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      chunks: ${{ steps.plan.outputs.chunks }}
      start_date: ${{ steps.plan.outputs.start_date }}
      end_date: ${{ steps.plan.outputs.end_date }}
    steps:
      - name: Build resumable 14-day chunk plan
        id: plan
        env:
          END_DATE_INPUT: ${{ inputs.end_date_utc }}
        run: |
          python3 - <<'PY'
          import json
          import os
          from datetime import date, datetime, timedelta, timezone

          lookback_days = 1825
          chunk_days = 14

          requested = os.environ.get("END_DATE_INPUT", "").strip()
          if requested:
              end_day = date.fromisoformat(requested)
          else:
              end_day = datetime.now(timezone.utc).date()

          start_day = end_day - timedelta(days=lookback_days)

          chunks = []
          cursor = start_day
          index = 1
          while cursor < end_day:
              chunk_end = min(cursor + timedelta(days=chunk_days), end_day)
              chunk_id = f"{cursor:%Y%m%d}_{chunk_end:%Y%m%d}"
              chunks.append({
                  "index": index,
                  "id": chunk_id,
                  "start": cursor.isoformat(),
                  "end": chunk_end.isoformat(),
              })
              cursor = chunk_end
              index += 1

          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as fh:
              fh.write(f"chunks={json.dumps(chunks, separators=(',', ':'))}\n")
              fh.write(f"start_date={start_day.isoformat()}\n")
              fh.write(f"end_date={end_day.isoformat()}\n")

          print(json.dumps({
              "lookback_days": lookback_days,
              "chunk_days": chunk_days,
              "chunk_count": len(chunks),
              "start_date": start_day.isoformat(),
              "end_date_exclusive": end_day.isoformat(),
          }, indent=2))
          PY

  prepare-chunks:
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        chunk: ${{ fromJSON(needs.plan.outputs.chunks) }}

    steps:
      - uses: actions/checkout@v4

      - name: Restore completed M5 chunk
        id: m5cache
        uses: actions/cache/restore@v4
        with:
          path: |
            gold-xauusd-data/chunks/xauusd-m5-${{ matrix.chunk.id }}.json.gz
            gold-xauusd-data/chunks/xauusd-m5-${{ matrix.chunk.id }}.manifest.json
          key: xauusd-m5-v5-${{ runner.os }}-${{ matrix.chunk.id }}

      - name: Restore raw M1 checkpoint for this chunk
        if: steps.m5cache.outputs.cache-hit != 'true'
        id: m1cache
        uses: actions/cache/restore@v4
        with:
          path: gold-xauusd-data/raw/${{ matrix.chunk.id }}
          key: xauusd-m1-v5-${{ runner.os }}-${{ matrix.chunk.id }}

      - name: Prepare chunk directories
        run: |
          mkdir -p "gold-xauusd-data/raw/${{ matrix.chunk.id }}"
          mkdir -p gold-xauusd-data/chunks

      - name: Validate downloader
        if: steps.m5cache.outputs.cache-hit != 'true'
        run: python3 scripts/fetch-xauusd-m5-chunk.py --self-test

      - name: Download or resume this 14-day chunk
        if: steps.m5cache.outputs.cache-hit != 'true'
        run: |
          python3 scripts/fetch-xauusd-m5-chunk.py             --start-date "${{ matrix.chunk.start }}"             --end-date "${{ matrix.chunk.end }}"             --cache-dir "gold-xauusd-data/raw/${{ matrix.chunk.id }}"             --output-file "gold-xauusd-data/chunks/xauusd-m5-${{ matrix.chunk.id }}.json.gz"             --manifest-file "gold-xauusd-data/chunks/xauusd-m5-${{ matrix.chunk.id }}.manifest.json"             --request-delay 2.0             --timeout 30             --retries 8

      - name: Save raw M1 checkpoint
        if: always() && steps.m5cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: gold-xauusd-data/raw/${{ matrix.chunk.id }}
          key: xauusd-m1-v5-${{ runner.os }}-${{ matrix.chunk.id }}

      - name: Save completed M5 chunk
        if: success() && steps.m5cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            gold-xauusd-data/chunks/xauusd-m5-${{ matrix.chunk.id }}.json.gz
            gold-xauusd-data/chunks/xauusd-m5-${{ matrix.chunk.id }}.manifest.json
          key: xauusd-m5-v5-${{ runner.os }}-${{ matrix.chunk.id }}

      - name: Upload chunk for assembly
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: gold-xauusd-m5-chunk-${{ matrix.chunk.id }}
          path: |
            gold-xauusd-data/chunks/xauusd-m5-${{ matrix.chunk.id }}.json.gz
            gold-xauusd-data/chunks/xauusd-m5-${{ matrix.chunk.id }}.manifest.json
          retention-days: 7
          if-no-files-found: error

  assemble-data:
    needs: [plan, prepare-chunks]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Download all completed chunks
        uses: actions/download-artifact@v4
        with:
          pattern: gold-xauusd-m5-chunk-*
          path: gold-xauusd-data/chunks
          merge-multiple: true

      - name: Assemble and validate five-year XAUUSD M5 dataset
        run: |
          python3 scripts/assemble-xauusd-m5.py             --input-dir gold-xauusd-data/chunks             --output-file gold-xauusd-data/xauusd-m5.json.gz             --manifest-file gold-xauusd-data/xauusd_m5_manifest.json             --start-date "${{ needs.plan.outputs.start_date }}"             --end-date "${{ needs.plan.outputs.end_date }}"             --min-bars 200000

      - name: Upload prepared XAUUSD M5 dataset
        uses: actions/upload-artifact@v4
        with:
          name: gold-xauusd-m5-1825d
          path: |
            gold-xauusd-data/xauusd-m5.json.gz
            gold-xauusd-data/xauusd_m5_manifest.json
          retention-days: 7
          if-no-files-found: error

  research:
    needs: assemble-data
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: baseline
            range_lookback: "12"
            min_range_atr: "0.80"
            max_range_atr: "2.80"
            breakout_atr: "0.10"
            body_atr: "0.40"
            close_location: "0.65"
            volume_ratio: "1.10"
            session_start: "7"
            session_end: "20"
          - name: strict
            range_lookback: "12"
            min_range_atr: "0.80"
            max_range_atr: "2.50"
            breakout_atr: "0.15"
            body_atr: "0.50"
            close_location: "0.70"
            volume_ratio: "1.25"
            session_start: "7"
            session_end: "17"
          - name: loose
            range_lookback: "18"
            min_range_atr: "0.60"
            max_range_atr: "3.50"
            breakout_atr: "0.05"
            body_atr: "0.30"
            close_location: "0.60"
            volume_ratio: "1.05"
            session_start: "7"
            session_end: "22"
          - name: ny_focus
            range_lookback: "12"
            min_range_atr: "0.80"
            max_range_atr: "2.80"
            breakout_atr: "0.10"
            body_atr: "0.40"
            close_location: "0.65"
            volume_ratio: "1.10"
            session_start: "12"
            session_end: "20"

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Download prepared XAUUSD M5 dataset
        uses: actions/download-artifact@v4
        with:
          name: gold-xauusd-m5-1825d
          path: gold-xauusd-data

      - name: Run test suite
        run: npm test

      - name: Run five-year XAUUSD M5 backtest
        env:
          GOLD_BACKTEST_LOOKBACK_DAYS: "1825"
          GOLD_BACKTEST_INITIAL_EQUITY: "100000"
          GOLD_BACKTEST_RISK_PCT: "0.25"
          GOLD_BACKTEST_SPREAD_PRICE: "0.50"
          GOLD_BACKTEST_SLIPPAGE_PRICE: "0.05"
          GOLD_BACKTEST_MAX_DAILY_LOSS_PCT: "2"
          GOLD_BACKTEST_MAX_DRAWDOWN_PCT: "5"
          GOLD_BACKTEST_MAX_HOLD_BARS: "96"
          GOLD_BACKTEST_MAX_ENTRY_GAP_ATR: "0.50"
          GOLD_RANGE_LOOKBACK: ${{ matrix.range_lookback }}
          GOLD_MIN_RANGE_ATR: ${{ matrix.min_range_atr }}
          GOLD_MAX_RANGE_ATR: ${{ matrix.max_range_atr }}
          GOLD_BREAKOUT_ATR: ${{ matrix.breakout_atr }}
          GOLD_MIN_BODY_ATR: ${{ matrix.body_atr }}
          GOLD_MIN_CLOSE_LOCATION: ${{ matrix.close_location }}
          GOLD_MIN_VOLUME_RATIO: ${{ matrix.volume_ratio }}
          GOLD_SESSION_START_UTC: ${{ matrix.session_start }}
          GOLD_SESSION_END_UTC: ${{ matrix.session_end }}
          GOLD_BACKTEST_DATA_FILE: gold-xauusd-data/xauusd-m5.json.gz
          GOLD_BACKTEST_OUTPUT_DIR: gold-backtest-output
        run: node scripts/backtest-gold-v2-resumable.mjs

      - name: Upload GOLD V2 results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gold-v2-${{ matrix.name }}
          path: gold-backtest-output/
          retention-days: 30
          if-no-files-found: warn
