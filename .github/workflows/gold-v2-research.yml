name: GOLD V2 Five-Year Research

# Resumability:
# - The 5-year data window is anchored by a committed config date.
# - Data is split into independent 14-day chunks.
# - Each chunk has its own stable M1/M5 cache key.
# - A new run on the same window reuses completed chunks.
# - Research uses the original detailed backtester so PF/DD/yearly/cost reports are preserved.
# - A successful run is the immutable data source for the downstream 3y IS / 2y OOS workflow.

on:
  push:
    branches: [main]
    paths:
      - 'config/gold-v2-data-window.json'
      - 'src/gold_strategy_v2.js'
      - 'scripts/backtest-gold-v2.mjs'
      - 'scripts/backtest-gold-v2-resumable.mjs'
      - 'scripts/fetch-xauusd-m5-chunk.py'
      - 'scripts/assemble-xauusd-m5.py'
      - 'tests/gold_strategy_v2.test.js'
      - '.github/workflows/gold-v2-research.yml'
  workflow_dispatch:
    inputs:
      end_date_utc:
        description: 'UTC cutoff date (exclusive), YYYY-MM-DD. Blank = committed research window date.'
        required: false
        default: ''

concurrency:
  # Use the legacy group so this resumable pipeline supersedes any stale monolithic run.
  group: gold-v2-research
  cancel-in-progress: true

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      chunks: ${{ steps.plan.outputs.chunks }}
      start_date: ${{ steps.plan.outputs.start_date }}
      end_date: ${{ steps.plan.outputs.end_date }}
      lookback_days: ${{ steps.plan.outputs.lookback_days }}
      cache_version: ${{ steps.plan.outputs.cache_version }}
    steps:
      - uses: actions/checkout@v4

      - name: Build resumable 14-day chunk plan
        id: plan
        env:
          END_DATE_INPUT: ${{ inputs.end_date_utc }}
        run: |
          python3 - <<'PY'
          import json
          import os
          from datetime import date, timedelta

          with open("config/gold-v2-data-window.json", "r", encoding="utf-8") as fh:
              cfg = json.load(fh)

          lookback_days = int(cfg["lookback_days"])
          chunk_days = int(cfg["chunk_days"])
          cache_version = str(cfg.get("cache_version", "")).strip()
          configured_end = str(cfg["end_date_utc"]).strip()

          if lookback_days < 365:
              raise SystemExit("lookback_days must be >= 365")
          if not (1 <= chunk_days <= 31):
              raise SystemExit("chunk_days must be between 1 and 31")
          if not cache_version:
              raise SystemExit("cache_version must be non-empty")

          requested = os.environ.get("END_DATE_INPUT", "").strip()
          end_day = date.fromisoformat(requested or configured_end)
          start_day = end_day - timedelta(days=lookback_days)

          chunks = []
          cursor = start_day
          index = 1
          while cursor < end_day:
              chunk_end = min(cursor + timedelta(days=chunk_days), end_day)
              chunk_id = f"{cursor:%Y%m%d}_{chunk_end:%Y%m%d}"
              chunks.append({
                  "index": index,
                  "id": chunk_id,
                  "start": cursor.isoformat(),
                  "end": chunk_end.isoformat(),
              })
              cursor = chunk_end
              index += 1

          if len(chunks) > 256:
              raise SystemExit(f"Too many matrix chunks: {len(chunks)} > 256")

          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as fh:
              fh.write(f"chunks={json.dumps(chunks, separators=(',', ':'))}\n")
              fh.write(f"start_date={start_day.isoformat()}\n")
              fh.write(f"end_date={end_day.isoformat()}\n")
              fh.write(f"lookback_days={lookback_days}\n")
              fh.write(f"cache_version={cache_version}\n")

          print(json.dumps({
              "lookback_days": lookback_days,
              "chunk_days": chunk_days,
              "chunk_count": len(chunks),
              "cache_version": cache_version,
              "start_date": start_day.isoformat(),
              "end_date_exclusive": end_day.isoformat(),
              "window_source": "workflow_dispatch" if requested else "config/gold-v2-data-window.json",
          }, indent=2))
          PY

  prepare-chunks:
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        chunk: ${{ fromJSON(needs.plan.outputs.chunks) }}

    steps:
      - uses: actions/checkout@v4

      - name: Restore completed M5 chunk
        id: m5cache
        uses: actions/cache/restore@v4
        with:
          path: |
            gold-xauusd-data/chunks/xauusd-m5-${{ matrix.chunk.id }}.json.gz
            gold-xauusd-data/chunks/xauusd-m5-${{ matrix.chunk.id }}.manifest.json
          key: xauusd-m5-${{ needs.plan.outputs.cache_version }}-${{ runner.os }}-${{ matrix.chunk.id }}

      - name: Restore raw M1 checkpoint for this chunk
        if: steps.m5cache.outputs.cache-hit != 'true'
        id: m1cache
        uses: actions/cache/restore@v4
        with:
          path: gold-xauusd-data/raw/${{ matrix.chunk.id }}
          key: xauusd-m1-${{ needs.plan.outputs.cache_version }}-${{ runner.os }}-${{ matrix.chunk.id }}-${{ github.run_id }}
          restore-keys: |
            xauusd-m1-${{ needs.plan.outputs.cache_version }}-${{ runner.os }}-${{ matrix.chunk.id }}-

      - name: Prepare chunk directories
        run: |
          mkdir -p "gold-xauusd-data/raw/${{ matrix.chunk.id }}"
          mkdir -p gold-xauusd-data/chunks

      - name: Validate downloader
        if: steps.m5cache.outputs.cache-hit != 'true'
        run: python3 scripts/fetch-xauusd-m5-chunk.py --self-test

      - name: Download or resume this 14-day chunk
        if: steps.m5cache.outputs.cache-hit != 'true'
        run: |
          python3 scripts/fetch-xauusd-m5-chunk.py \
            --start-date "${{ matrix.chunk.start }}" \
            --end-date "${{ matrix.chunk.end }}" \
            --cache-dir "gold-xauusd-data/raw/${{ matrix.chunk.id }}" \
            --output-file "gold-xauusd-data/chunks/xauusd-m5-${{ matrix.chunk.id }}.json.gz" \
            --manifest-file "gold-xauusd-data/chunks/xauusd-m5-${{ matrix.chunk.id }}.manifest.json" \
            --request-delay 1.5 \
            --timeout 30 \
            --retries 8

      # Persist raw data even when the downloader exits non-zero.
      # On a future rerun, completed day files from this chunk can be reused.
      - name: Save raw M1 checkpoint
        if: always() && steps.m5cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: gold-xauusd-data/raw/${{ matrix.chunk.id }}
          key: xauusd-m1-${{ needs.plan.outputs.cache_version }}-${{ runner.os }}-${{ matrix.chunk.id }}-${{ github.run_id }}

      - name: Save completed M5 chunk
        if: success() && steps.m5cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            gold-xauusd-data/chunks/xauusd-m5-${{ matrix.chunk.id }}.json.gz
            gold-xauusd-data/chunks/xauusd-m5-${{ matrix.chunk.id }}.manifest.json
          key: xauusd-m5-${{ needs.plan.outputs.cache_version }}-${{ runner.os }}-${{ matrix.chunk.id }}

      - name: Upload chunk for assembly
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: gold-xauusd-m5-chunk-${{ matrix.chunk.id }}
          path: |
            gold-xauusd-data/chunks/xauusd-m5-${{ matrix.chunk.id }}.json.gz
            gold-xauusd-data/chunks/xauusd-m5-${{ matrix.chunk.id }}.manifest.json
          retention-days: 7
          if-no-files-found: error

  assemble-data:
    needs: [plan, prepare-chunks]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Download all completed chunks
        uses: actions/download-artifact@v4
        with:
          pattern: gold-xauusd-m5-chunk-*
          path: gold-xauusd-data/chunks
          merge-multiple: true

      - name: Assemble and validate five-year XAUUSD M5 dataset
        run: |
          python3 scripts/assemble-xauusd-m5.py \
            --input-dir gold-xauusd-data/chunks \
            --output-file gold-xauusd-data/xauusd-m5.json.gz \
            --manifest-file gold-xauusd-data/xauusd_m5_manifest.json \
            --start-date "${{ needs.plan.outputs.start_date }}" \
            --end-date "${{ needs.plan.outputs.end_date }}" \
            --min-bars 200000

      - name: Upload prepared XAUUSD M5 dataset
        uses: actions/upload-artifact@v4
        with:
          name: gold-xauusd-m5-1825d
          path: |
            gold-xauusd-data/xauusd-m5.json.gz
            gold-xauusd-data/xauusd_m5_manifest.json
          retention-days: 7
          if-no-files-found: error

  research:
    needs: assemble-data
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        include:
          - name: baseline
            range_lookback: "12"
            min_range_atr: "0.80"
            max_range_atr: "2.80"
            breakout_atr: "0.10"
            body_atr: "0.40"
            close_location: "0.65"
            volume_ratio: "1.10"
            session_start: "7"
            session_end: "20"
          - name: strict
            range_lookback: "12"
            min_range_atr: "0.80"
            max_range_atr: "2.50"
            breakout_atr: "0.15"
            body_atr: "0.50"
            close_location: "0.70"
            volume_ratio: "1.25"
            session_start: "7"
            session_end: "17"
          - name: loose
            range_lookback: "18"
            min_range_atr: "0.60"
            max_range_atr: "3.50"
            breakout_atr: "0.05"
            body_atr: "0.30"
            close_location: "0.60"
            volume_ratio: "1.05"
            session_start: "7"
            session_end: "22"
          - name: range_max_4
            range_lookback: "12"
            min_range_atr: "0.80"
            max_range_atr: "4.00"
            breakout_atr: "0.10"
            body_atr: "0.40"
            close_location: "0.65"
            volume_ratio: "1.10"
            session_start: "7"
            session_end: "20"
          - name: range_max_4_5
            range_lookback: "12"
            min_range_atr: "0.80"
            max_range_atr: "4.50"
            breakout_atr: "0.10"
            body_atr: "0.40"
            close_location: "0.65"
            volume_ratio: "1.10"
            session_start: "7"
            session_end: "20"
          - name: range_max_5
            range_lookback: "12"
            min_range_atr: "0.80"
            max_range_atr: "5.00"
            breakout_atr: "0.10"
            body_atr: "0.40"
            close_location: "0.65"
            volume_ratio: "1.10"
            session_start: "7"
            session_end: "20"
          - name: range_max_5_5
            range_lookback: "12"
            min_range_atr: "0.80"
            max_range_atr: "5.50"
            breakout_atr: "0.10"
            body_atr: "0.40"
            close_location: "0.65"
            volume_ratio: "1.10"
            session_start: "7"
            session_end: "20"
          - name: ny_focus
            range_lookback: "12"
            min_range_atr: "0.80"
            max_range_atr: "2.80"
            breakout_atr: "0.10"
            body_atr: "0.40"
            close_location: "0.65"
            volume_ratio: "1.10"
            session_start: "12"
            session_end: "20"

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Download prepared XAUUSD M5 dataset
        uses: actions/download-artifact@v4
        with:
          name: gold-xauusd-m5-1825d
          path: gold-xauusd-data

      - name: Run test suite
        run: npm test

      # Keep the original detailed backtester here. The resumability layer is
      # for data acquisition; the production research report remains unchanged.
      - name: Run five-year XAUUSD M5 backtest
        env:
          GOLD_BACKTEST_LOOKBACK_DAYS: "1825"
          GOLD_BACKTEST_INITIAL_EQUITY: "100000"
          GOLD_BACKTEST_RISK_PCT: "0.25"
          GOLD_BACKTEST_SPREAD_PRICE: "0.50"
          GOLD_BACKTEST_SLIPPAGE_PRICE: "0.05"
          GOLD_BACKTEST_MAX_DAILY_LOSS_PCT: "2"
          GOLD_BACKTEST_MAX_DRAWDOWN_PCT: "5"
          GOLD_BACKTEST_MAX_HOLD_BARS: "96"
          GOLD_BACKTEST_MAX_ENTRY_GAP_ATR: "0.50"
          GOLD_RANGE_LOOKBACK: ${{ matrix.range_lookback }}
          GOLD_MIN_RANGE_ATR: ${{ matrix.min_range_atr }}
          GOLD_MAX_RANGE_ATR: ${{ matrix.max_range_atr }}
          GOLD_BREAKOUT_ATR: ${{ matrix.breakout_atr }}
          GOLD_MIN_BODY_ATR: ${{ matrix.body_atr }}
          GOLD_MIN_CLOSE_LOCATION: ${{ matrix.close_location }}
          GOLD_MIN_VOLUME_RATIO: ${{ matrix.volume_ratio }}
          GOLD_SESSION_START_UTC: ${{ matrix.session_start }}
          GOLD_SESSION_END_UTC: ${{ matrix.session_end }}
          GOLD_BACKTEST_DATA_FILE: gold-xauusd-data/xauusd-m5.json.gz
          GOLD_BACKTEST_OUTPUT_DIR: gold-backtest-output
        run: node scripts/backtest-gold-v2.mjs

      - name: Upload GOLD V2 results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gold-v2-${{ matrix.name }}
          path: gold-backtest-output/
          retention-days: 30
          if-no-files-found: warn

  aggregate-results:
    needs: [research]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Download all variant reports
        uses: actions/download-artifact@v4
        with:
          pattern: gold-v2-*
          path: gold-v2-research-artifacts
          merge-multiple: false

      - name: Build research matrix summary
        run: |
          python3 - <<'PY'
          import csv
          import json
          from pathlib import Path

          root = Path("gold-v2-research-artifacts")
          rows = []
          for report_path in sorted(root.glob("*/gold_v2_backtest_report.json")):
              variant = report_path.parent.name.removeprefix("gold-v2-")
              try:
                  report = json.loads(report_path.read_text(encoding="utf-8"))
                  base = report["results"]["baseline"]
                  cons = report["results"]["conservative"]
                  rows.append({
                      "variant": variant,
                      "five_year_trades": base["summary"]["trades"],
                      "five_year_pf": base["summary"]["profit_factor"],
                      "five_year_expectancy_R": base["summary"]["expectancy_R"],
                      "five_year_maxDD_pct": base["summary"]["max_drawdown_pct"],
                      "oos730_trades": base.get("oos730", {}).get("trades", 0),
                      "oos730_pf": base.get("oos730", {}).get("profit_factor", 0),
                      "oos730_expectancy_R": base.get("oos730", {}).get("expectancy_R", 0),
                      "oos730_maxDD_pct": base.get("oos730", {}).get("max_drawdown_pct", 0),
                      "is1095_trades": base.get("is1095", {}).get("trades", 0),
                      "is1095_pf": base.get("is1095", {}).get("profit_factor", 0),
                      "is1095_expectancy_R": base.get("is1095", {}).get("expectancy_R", 0),
                      "conservative_trades": cons["summary"]["trades"],
                      "conservative_pf": cons["summary"]["profit_factor"],
                      "conservative_expectancy_R": cons["summary"]["expectancy_R"],
                      "conservative_maxDD_pct": cons["summary"]["max_drawdown_pct"],
                      "recent365_trades": base["recent365"]["trades"],
                      "recent365_pf": base["recent365"]["profit_factor"],
                      "recent365_expectancy_R": base["recent365"]["expectancy_R"],
                      "quality_gate": bool(base["qualityGate"]["passed"]),
                  })
              except Exception as exc:
                  rows.append({"variant": variant, "error": str(exc)})

          rows.sort(key=lambda r: (r.get("oos730_expectancy_R", -999), r.get("oos730_pf", -999)), reverse=True)

          out = Path("gold-v2-research-summary")
          out.mkdir(parents=True, exist_ok=True)
          (out / "gold_v2_research_matrix.json").write_text(json.dumps(rows, indent=2), encoding="utf-8")

          fields = [
              "variant","five_year_trades","five_year_pf","five_year_expectancy_R","five_year_maxDD_pct",
              "oos730_trades","oos730_pf","oos730_expectancy_R","oos730_maxDD_pct",
              "is1095_trades","is1095_pf","is1095_expectancy_R",
              "conservative_trades","conservative_pf","conservative_expectancy_R","conservative_maxDD_pct",
              "recent365_trades","recent365_pf","recent365_expectancy_R","quality_gate"
          ]
          with (out / "gold_v2_research_matrix.csv").open("w", newline="", encoding="utf-8") as fh:
              writer = csv.DictWriter(fh, fieldnames=fields)
              writer.writeheader()
              for row in rows:
                  if "error" not in row:
                      writer.writerow(row)

          def fmt(v):
              if isinstance(v, bool): return "PASS" if v else "FAIL"
              if isinstance(v, float): return f"{v:.3f}"
              return str(v)

          md = [
              "# Gold V2 research matrix",
              "",
              "本番設定は変更していません。Range ATR variant は研究専用です。",
              "5y = 全期間、IS = 直近2年を除く前3年、OOS = 直近2年。",
              "Conservative = spread >= 0.75 + slippage >= 0.10 のコストストレス。",
              "",
              "| Variant | 5y trades | 5y PF | 5y Exp(R) | 5y MaxDD% | OOS trades | OOS PF | OOS Exp(R) | OOS MaxDD% | Cons PF | Cons Exp(R) | Quality Gate |",
              "|---|---:|---:|---:|---:|---:|---:|---:|---:|---:|---:|---|",
          ]
          for r in rows:
              if "error" in r:
                  md.append(f"| {r['variant']} | ERROR | | | | | | | | | | |")
              else:
                  md.append(
                      f"| {r['variant']} | {r['five_year_trades']} | {fmt(r['five_year_pf'])} | "
                      f"{fmt(r['five_year_expectancy_R'])} | {fmt(r['five_year_maxDD_pct'])} | "
                      f"{r['oos730_trades']} | {fmt(r['oos730_pf'])} | {fmt(r['oos730_expectancy_R'])} | "
                      f"{fmt(r['oos730_maxDD_pct'])} | {fmt(r['conservative_pf'])} | "
                      f"{fmt(r['conservative_expectancy_R'])} | {fmt(r['quality_gate'])} |"
                  )
          (out / "gold_v2_research_matrix.md").write_text("\n".join(md) + "\n", encoding="utf-8")

          print((out / "gold_v2_research_matrix.md").read_text(encoding="utf-8"))
          PY

      - name: Upload consolidated research summary
        uses: actions/upload-artifact@v4
        with:
          name: gold-v2-research-matrix-summary
          path: gold-v2-research-summary/
          retention-days: 90
          if-no-files-found: error
